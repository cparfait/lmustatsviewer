<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        --ink: #12151d;
        --white: #f7f8fa;
        --blue: #3fa9e6;
        --red: #e2412b;
        --orange: #d93b00;
        --night: #0b101f;
        --night-2: #131a30;
        --text: #eef1f6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* ---------- Scène piste ---------- */
      #world {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--night);
      }
      #sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #3b97de 0%, #74bde9 38%, #b9e0f4 62%, #e9f6fb 78%);
      }
      #sun {
        position: absolute;
        left: 1380px;
        top: 70px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 246, 214, 0.95) 0 18%, rgba(255, 236, 170, 0.35) 34%, rgba(255, 236, 170, 0) 70%);
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
      }
      .layer svg {
        display: block;
        overflow: visible;
      }
      #car-rig {
        position: absolute;
        left: 0;
        top: 0;
        width: 810px;
        height: 324px;
      }
      #car-body {
        position: absolute;
        inset: 0;
      }
      .car-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 810px;
        height: 324px;
        overflow: visible;
      }
      .wheel {
        position: absolute;
        width: 135px;
        height: 135px;
      }
      #wheel-r {
        left: 126px;
        top: 175.5px;
      }
      #wheel-f {
        left: 553.5px;
        top: 175.5px;
      }
      #car-shadow {
        position: absolute;
        left: 20px;
        top: 290px;
        width: 770px;
        height: 34px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(10, 20, 15, 0.42), rgba(10, 20, 15, 0));

      #pilot-clip {
        position: absolute;
        inset: 0;

      #pilot-pos {
        position: absolute;
        left: 0;
        top: 0;

        height: 267.4px;
      }
      #pilot-spin,

        position: absolute;
        inset: 0;
      }
      .pilot-img {

        left: 0;
        top: 0;
        width: 194.3px;
        height: 267.4px;
        background: url("assets/pilot.png") 0 0 / 100% 100% no-repeat;

      #headlight-glow {
        position: absolute;
        left: 650px;
        top: 130px;
        width: 360px;

        border-radius: 50%;

      #flame {

        border-radius: 9px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.9));
        transform-origin: 100% 50%;

      .puff {
        position: absolute;

        height: 90px;
      }

        position: absolute;
        border-radius: 50%;

      #impact {

      /* ---------- Volet vibreur ---------- */
      #wipe-band {
        position: absolute;

      /* ---------- Titre ---------- */

      .lockup {
        position: absolute;

        flex-direction: column;
        align-items: center;

        gap: 44px;
        padding: 120px 160px;
      }
      #badge {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        overflow: hidden;
        border: 8px solid var(--white);
        box-shadow:
          0 0 0 8px var(--orange),

      #badge img {

        height: 100%;
      }
      .title-skew {

      }
      #title-wrap {
        position: relative;
        display: inline-block;

      #title {
        display: block;

        color: var(--text);

      }
      #minicar svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 230px;
        height: 92px;
        overflow: visible;
      }
    </style>

    <script>
      (function () {
        // ================================================================
        //  Géométrie de la piste (coordonnées "monde", y vers le bas)
        // ================================================================
        const KN = [
          [-3000, 860],
          [1900, 860],
          [2700, 940],
          [2950, 940],
          [4200, 380],
          [8000, 380],
        ];
        function Y(x) {
          for (let i = 0; i < KN.length - 1; i++) {
            const [x0, y0] = KN[i];
            const [x1, y1] = KN[i + 1];
            if (x <= x1) {
              const u = Math.max(0, (x - x0) / (x1 - x0));
              return y0 + ((y1 - y0) * (1 - Math.cos(Math.PI * u))) / 2;
            }
          }
          return KN[KN.length - 1][1];
        }
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const smooth = (u) => {
          u = clamp(u, 0, 1);
          return u * u * (3 - 2 * u);
        };
        // PRNG déterministe (seedé) pour placer arbres / touffes
        function rng(seed) {
          let s = seed >>> 0;
          return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const f1 = (n) => Math.round(n * 10) / 10;
        function line(fn, x0, x1, step) {
          const pts = [];
          const n = Math.round((x1 - x0) / step);
          for (let i = 0; i <= n; i++) {
            const x = x0 + i * step;
            pts.push(f1(x) + "," + f1(fn(x)));
          }
          return pts;
        }

        const PAL = {
          ink: "#12151d",
          white: "#f7f8fa",
          blue: "#3fa9e6",
          red: "#e2412b",
          orange: "#D93B00",
          tire: "#1d2028",
        };

        // ================================================================
        //  Décor : nuages, collines, forêt, piste
        // ================================================================
        function pine(x, base, h, dark, light) {
          const w = h * 0.42;
          let s = `<rect x="${f1(x - w * 0.06)}" y="${f1(base - h * 0.16)}" width="${f1(w * 0.12)}" height="${f1(h * 0.18)}" fill="#5a3b26"/>`;
          for (let k = 0; k < 3; k++) {
            const top = base - h + k * h * 0.24;
            const bot = base - h * 0.12 - (2 - k) * h * 0.2;
            const ww = w * (0.55 + k * 0.22);
            s += `<path d="M${f1(x)} ${f1(top)} L${f1(x + ww)} ${f1(bot)} L${f1(x - ww)} ${f1(bot)} Z" fill="${dark}"/>`;
            s += `<path d="M${f1(x)} ${f1(top)} L${f1(x + ww)} ${f1(bot)} L${f1(x + ww * 0.25)} ${f1(bot)} Z" fill="${light}"/>`;
          }
          return s;
        }
        function cloud(x, y, s) {
          return `<g transform="translate(${x} ${y}) scale(${s})">
            <path d="M0 60 Q-10 20 40 22 Q55 -12 100 4 Q140 -14 165 22 Q215 20 205 60 Z" fill="#ffffff"/>
            <path d="M0 60 Q40 48 100 54 Q160 48 205 60 Z" fill="#dfeef8"/></g>`;
        }

        // Nuages (parallaxe 0.06)
        document.getElementById("clouds").innerHTML =
          `<svg width="2400" height="500" viewBox="0 0 2400 500">` +
          cloud(120, 120, 1.1) +
          cloud(700, 70, 0.8) +
          cloud(1150, 170, 1.3) +
          cloud(1750, 90, 0.9) +
          cloud(2150, 150, 1.0) +
          `</svg>`;

        // Collines lointaines (parallaxe 0.2)
        (function () {
          const Wd = 2900;
          const h1 = line((x) => 560 - 70 * Math.sin(x / 260 + 0.6) - 40 * Math.sin(x / 97), -20, Wd + 20, 20);
          const h2 = line((x) => 640 - 60 * Math.sin(x / 210 + 2.1) - 25 * Math.sin(x / 71 + 1), -20, Wd + 20, 20);
          document.getElementById("far").innerHTML =
            `<svg width="${Wd}" height="1400" viewBox="0 0 ${Wd} 1400">` +
            `<path d="M-20 1400 L${h1.join(" L")} L${Wd + 20} 1400 Z" fill="#a7cfd2"/>` +
            `<path d="M-20 1400 L${h2.join(" L")} L${Wd + 20} 1400 Z" fill="#86bcb1"/>` +
            `</svg>`;
        })();

        // Forêt des Ardennes (parallaxe 0.5)
        (function () {
          const Wd = 3600;
          const r = rng(7);
          let back = "";
          let front = "";
          for (let x = -40; x < Wd + 60; x += 46 + r() * 30) back += pine(x, 760 + r() * 20, 200 + r() * 130, "#4f8f78", "#6aa58c");
          for (let x = -20; x < Wd + 60; x += 58 + r() * 40) front += pine(x, 800 + r() * 20, 170 + r() * 110, "#2d6a4c", "#3f8160");
          document.getElementById("mid").innerHTML =
            `<svg width="${Wd}" height="1400" viewBox="0 0 ${Wd} 1400">` +
            back +
            `<rect x="-40" y="770" width="${Wd + 100}" height="700" fill="#4f8f78"/>` +
            front +
            `<rect x="-40" y="805" width="${Wd + 100}" height="700" fill="#2d6a4c"/>` +
            `</svg>`;
        })();

        // Piste (parallaxe 1)
        (function () {
          const X0 = -200;
          const X1 = 6200;
          const st = 10;
          const bankTop = (x) => Y(x) - 150 - 34 * Math.sin(x / 230) - 18 * Math.sin(x / 83 + 1.3);
          const r = rng(21);
          let trees = "";
          for (let x = X0; x < X1; x += 70 + r() * 70) {
            const h = 150 + r() * 120;
            trees += pine(x, bankTop(x) + 20, h, r() > 0.5 ? "#2f7650" : "#367f57", "#4c9a6b");
          }
          const bank = `M${X0} ${Y(X0) - 30} L${line(bankTop, X0, X1, st).join(" L")} L${X1} ${Y(X1) - 30} L${line((x) => Y(x) - 30, X1, X0, -st).join(" L")} Z`;
          const rail1 = line((x) => Y(x) - 64, X0, X1, st).join(" L");
          const rail2 = line((x) => Y(x) - 54, X0, X1, st).join(" L");
          let posts = "";
          for (let x = X0; x < X1; x += 70) posts += `<rect x="${x}" y="${f1(Y(x) - 66)}" width="7" height="26" fill="#8d96a3"/>`;
          const roadTop = line((x) => Y(x) - 46, X0, X1, st);
          const roadBot = line((x) => Y(x) + 20, X1, X0, -st);
          const road = `M${roadTop.join(" L")} L${roadBot.join(" L")} Z`;
          const farKerb = line((x) => Y(x) - 46, X0, X1, st).join(" L");
          const nearKerb = line((x) => Y(x) + 27, X0, X1, st).join(" L");
          const racing = line((x) => Y(x) - 8, X0, X1, st).join(" L");
          const grass = `M${line((x) => Y(x) + 34, X0, X1, st).join(" L")} L${X1} 1600 L${X0} 1600 Z`;
          let tufts = "";
          const r2 = rng(5);

        // ================================================================

        function vTarget(x) {

          let t = T_LAUNCH;

          let frame = 0;
          while (x < 5050) {
            const v = Math.min(Math.sqrt(2 * ACC * (x - CAR_X0)) + 40, vTarget(x));

        tl.to("#pilot-body", { y: -14, duration: 0.08, ease: "power2.out" }, 3.28);
        tl.to("#pilot-body", { y: 0, duration: 0.08, ease: "power2.in" }, 3.36);
        tl.to("#pilot-head", { rotation: -5, duration: 0.12, ease: "sine.inOut" }, 3.12);
        tl.to("#pilot-head", { rotation: 4, duration: 0.12, ease: "sine.inOut" }, 3.24);
        tl.to("#pilot-head", { rotation: 0, duration: 0.12, ease: "sine.inOut" }, 3.36);

        // --- Démarrage moteur : démarreur, ça prend, ralenti ---
        function shake(t0, dur, n, ay, ar) {
          const kf = [];
          for (let i = 1; i <= n; i++) {
            const a = i === n ? 0 : 1;
            kf.push({ y: a * (i % 2 ? -ay : ay * 0.85), rotation: a * (i % 3 === 0 ? ar : -ar * 0.7), duration: dur / n });
          }
          tl.to("#car-body", { keyframes: K(kf, "sine.inOut") }, t0);
        }
        shake(3.45, 0.32, 8, 1.2, 0.15);
        tl.to("#car-body", { rotation: -1.6, y: -3, duration: 0.08, ease: "power2.out" }, 3.78);
        tl.to("#car-body", { rotation: 0, y: 0, duration: 0.14, ease: "power2.inOut" }, 3.86);
        shake(4.0, 0.4, 12, 2.4, 0.45);
        tl.fromTo("#headlight-glow", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 3.78);
        tl.to("#headlight-glow", { opacity: 0.35, duration: 0.05, ease: "none" }, 3.83);
        tl.to("#headlight-glow", { opacity: 1, duration: 0.07, ease: "none" }, 3.88);
        tl.fromTo("#flame", { scaleX: 0, opacity: 1, transformOrigin: "100% 50%" }, { scaleX: 1.2, duration: 0.07, ease: "power2.out" }, 3.8);
        tl.to("#flame", { scaleX: 0, duration: 0.13, ease: "power2.in" }, 3.87);
        const idle = $("#idle-smoke");
        [3.82, 4.02, 4.2].forEach((t, i) => {
          const p = makePuff(idle, -16, 236, "idle" + i);
          burst(tl, p, t, { x: 0, y: 0, scale: 0.15 }, { x: -150, y: -40, scale: 1 }, 0.62);
        });
        // Les mains sur le volant
        tl.to("#pilot-body", { y: 80, duration: 0.22, ease: "power2.in" }, 4.05);
        tl.to("#pilot-head", { rotation: -4, duration: 0.12, ease: "power1.out" }, 4.08);
        tl.to("#pilot-head", { rotation: 0, duration: 0.18, ease: "power1.inOut" }, 4.2);

        // --- Départ ! ---
        const kRig = [];
        const kWr = [];
        const kTrack = [];
        const kMid = [];
        const kFar = [];
        const kClouds = [];
        const kR3 = [];
        const kR3w = [];
        // Rival vert : il roule devant, on le double dans la montée
        const V_R3 = 600;
        const tCatch = sampleAt(3560).t;
        const XR3_0 = 3560 - V_R3 * (tCatch - T_LAUNCH);
        for (let i = 1; i < samples.length; i++) {
          const s = samples[i];
          const d = s.t - samples[i - 1].t;
          const pose = carPose(s.x, 211.5, 216, 0);
          const camY = camYof(s.camX);
          kRig.push({ x: s.x - 405, y: pose.gy - 306, rotation: pose.rot, duration: d });
          kWr.push({ rotation: (((s.x - CAR_X0) / RWHEEL) * 180) / Math.PI, duration: d });
          kTrack.push({ x: -s.camX, y: -camY, duration: d });
          kMid.push({ x: -s.camX * 0.5, y: -camY * 0.5, duration: d });
          kFar.push({ x: -s.camX * 0.2, y: -camY * 0.2, duration: d });
          kClouds.push({ x: -s.camX * 0.06, duration: d });
          const xr3 = XR3_0 + V_R3 * (s.t - T_LAUNCH);
          const p3 = carPose(xr3, 188, 192, LANE);
          kR3.push({ x: xr3 - 360, y: p3.gy - 272, rotation: p3.rot, duration: d });
          kR3w.push({ rotation: (((xr3 - XR3_0) / 56) * 180) / Math.PI, duration: d });
        }
        const T0 = samples[0].t;
        tl.to("#car-rig", { keyframes: K(kRig, "none") }, T0);
        tl.to(["#wheel-r", "#wheel-f"], { keyframes: K(kWr, "none") }, T0);
        tl.to("#track", { keyframes: K(kTrack, "none") }, T0);
        tl.to("#mid", { keyframes: K(kMid, "none") }, T0);
        tl.to("#far", { keyframes: K(kFar, "none") }, T0);
        tl.to("#clouds", { keyframes: K(kClouds, "none") }, T0);
        const p30 = carPose(XR3_0, 188, 192, LANE);
        tl.set("#r3", { x: XR3_0 - 360, y: p30.gy - 272, rotation: p30.rot }, T0 - 0.01);
        tl.to("#r3", { keyframes: K(kR3, "none") }, T0);
        tl.to("#r3 .spin", { keyframes: K(kR3w, "none") }, T0);

        tl.to("#car-body", { rotation: -3.2, duration: 0.14, ease: "power2.out" }, T_LAUNCH);
        tl.to("#car-body", { rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" }, T_LAUNCH + 0.14);
        tl.to("#pilot-head", { rotation: -12, duration: 0.12, ease: "power2.out" }, T_LAUNCH);
        tl.to("#pilot-head", { rotation: 0, duration: 0.5, ease: "power2.inOut" }, T_LAUNCH + 0.25);
        const tBottom = sampleAt(2860).t;
        tl.to("#car-body", { y: 12, duration: 0.1, ease: "power2.out" }, tBottom - 0.05);
        tl.to("#car-body", { y: 0, duration: 0.35, ease: "back.out(2)" }, tBottom + 0.05);
        tl.to("#pilot-head", { rotation: -8, duration: 0.25, ease: "power1.out" }, tBottom);
        tl.to("#pilot-head", { rotation: 7, duration: 0.18, ease: "power1.out" }, tCatch);
        tl.to("#pilot-head", { rotation: -6, duration: 0.2, ease: "power1.inOut" }, tCatch + 0.2);
        const tCrest = sampleAt(4150).t;
        tl.to("#pilot-head", { rotation: 6, duration: 0.2, ease: "power1.out" }, tCrest);

        (function () {
          const kf = [];
          for (let i = 0; i < 10; i++) kf.push({ scaleX: i % 2 ? 0.7 : 1.25, duration: 0.05 });
          kf.push({ scaleX: 0, duration: 0.08 });
          tl.to("#flame", { keyframes: K(kf, "none") }, T_LAUNCH);
        })();
        const smoke = $("#smoke-layer");
        const xAt = (t) => {
          for (let i = 1; i < samples.length; i++) if (samples[i].t >= t) return samples[i].x;
          return samples[samples.length - 1].x;
        };
        [0, 0.07, 0.14, 0.22, 0.31, 0.42].forEach((dtp, i) => {
          const t = T_LAUNCH + dtp;
          const xr = xAt(t) - 211;
          const p = makePuff(smoke, xr - 30, Y(xr) - 20, "spin" + i);
          burst(tl, p, t, { scale: 0.3, x: 0, y: 0 }, { scale: 1.7, x: -90, y: -50 }, 0.76);
        });
        for (let i = 0; i < 5; i++) {
          const kf = [];
          for (let j = 0; j < 18; j++) kf.push({ scaleX: 0.6 + ((i * 7 + j * 3) % 5) * 0.12, x: ((i + j) % 3) * -14, duration: 0.12 });
          tl.fromTo("#sl" + i, { opacity: 0, scaleX: 0.3 }, { opacity: 0.85, scaleX: 1, duration: 0.2, ease: "power1.out" }, T_LAUNCH + 0.4 + i * 0.03);
          tl.to("#sl" + i, { keyframes: K(kf, "sine.inOut") }, T_LAUNCH + 0.62 + i * 0.03);
        }

        // ================================================================
        //  Volet vibreur + titre
        // ================================================================
        const WIPE_T = 7.3;
        const WIPE_D = 0.65;
        tl.fromTo("#wipe-band", { x: -500 }, { x: 2500, duration: WIPE_D, ease: "power2.inOut" }, WIPE_T);
        tl.fromTo(
          "#title-inner",
          { clipPath: "polygon(-600px 0px, -325px 0px, -675px 1080px, -600px 1080px)" },
          { clipPath: "polygon(-600px 0px, 2675px 0px, 2325px 1080px, -600px 1080px)", duration: WIPE_D, ease: "power2.inOut" },
          WIPE_T
        );
        tl.fromTo("#badge", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.9)" }, 7.7);
        tl.fromTo("#title .ch", { x: 70, opacity: 0, skewX: -20 }, { x: 0, opacity: 1, skewX: 0, duration: 0.32, ease: "power3.out", stagger: 0.025 }, 7.9);
        const ZIP_T = 8.18;
        const ZIP_D = 0.56;
        tl.fromTo("#minicar-track", { xPercent: -60 }, { xPercent: 135, duration: ZIP_D, ease: "power1.in" }, ZIP_T);
        tl.fromTo(
          "#underline",
          { clipPath: "polygon(0% 0%, -60% 0%, -60% 100%, 0% 100%)" },
          { clipPath: "polygon(0% 0%, 135% 0%, 135% 100%, 0% 100%)", duration: ZIP_D, ease: "power1.in" },
          ZIP_T
        );
        tl.fromTo("#minicar .spin", { rotation: 0 }, { rotation: 1440, duration: ZIP_D, ease: "power1.in" }, ZIP_T);
        tl.fromTo("#title", { y: 0 }, { y: -6, duration: 0.1, ease: "power2.out" }, ZIP_T + 0.3);
        tl.to("#title", { y: 0, duration: 0.25, ease: "back.out(3)" }, ZIP_T + 0.4);
        // À partir de ~8.85 s tout est figé jusqu'à la fin (10.4 s) : temps de lecture.

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
