name: Release

# Construit l'installeur Windows (.exe NSIS), signe la mise à jour et crée
# une GitHub Release — UNIQUEMENT quand un tag de version `vX.Y.Z` est poussé
# (ou via déclenchement manuel). Les commits / push ordinaires ne déclenchent
# rien : une nouvelle version n'atteint les utilisateurs que sur un tag.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY  → contenu du fichier _lmu_updater.key
#   (la clé a été générée sans mot de passe, voir SUIVI.md)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Deux tags poussés coup sur coup ne doivent pas se disputer le cache Cargo.
# `cancel-in-progress: false` : une release déjà lancée va au bout.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Versions cohérentes AVANT tout le reste (quelques secondes) ─────────
  # `build.rs` propage `version.json` vers les manifestes PENDANT la
  # compilation, mais Cargo a déjà lu `Cargo.toml` : un manifeste resté à
  # l'ancienne version donnait un installeur à l'ancien numéro sous un tag
  # neuf, sans erreur (RELEASE.md §A.1). On refuse donc tout écart, et un tag
  # qui ne correspond pas à `version.json`.
  versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check versions
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $found = [ordered]@{
            "package.json"              = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "src-tauri/tauri.conf.json" = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            "src-tauri/Cargo.toml"      = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $bad = $false
          foreach ($k in $found.Keys) {
            if ($found[$k] -ne $v) {
              Write-Host "::error file=$k::version $($found[$k]) au lieu de $v (version.json). Lancer 'cargo check' dans src-tauri puis commiter les manifestes."
              $bad = $true
            }
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Host "::error::Le tag ${{ github.ref_name }} ne correspond pas a version.json (v$v)."
            $bad = $true
          }
          if ($bad) { exit 1 }
          Write-Host "Versions coherentes : $v"

  # Contrôles complets (lint, typage, tests du coach, tests Rust Windows, service
  # communautaire) rejoués sur le SHA exact du tag. Avant, seuls les contrôles
  # TypeScript précédaient la signature : un tag pouvait produire un installeur
  # signé avec des tests Rust ou communautaires en échec.
  ci:
    needs: versions
    uses: ./.github/workflows/ci.yml

  release:
    needs: [versions, ci]
    # Épinglé : `windows-latest` pointe désormais sur une image dont le
    # toolchain MSVC (14.51) ne compile plus les sources C++ de DuckDB
    # (`duckdb` est en feature `bundled` → tout libduckdb est recompilé ici).
    # `windows-2022` embarque le MSVC 14.4x, celui sur lequel le projet est
    # développé et validé. À réévaluer quand DuckDB suivra le nouveau MSVC.
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      # Lint, typage et tests : job `ci` ci-dessus (needs), sur le même SHA.

      # Assets vocaux (lourds, hors git) : voix neuronale Piper + modèles de
      # reconnaissance Vosk + bibliothèques sherpa-onnx (dictée Parakeet). Mis en cache par hash des scripts de fetch (les scripts
      # sautent les fichiers déjà présents → cache hit = quasi instantané).
      - name: Cache voice assets
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/tts/piper
            src-tauri/resources/tts/voices
            src-tauri/resources/stt/lib
            src-tauri/resources/stt/models
            src-tauri/resources/stt/sherpa
          key: voice-assets-${{ hashFiles('scripts/fetch-piper.ps1', 'scripts/fetch-vosk.ps1', 'scripts/fetch-sherpa.ps1') }}

      - name: Fetch Piper neural voices
        shell: pwsh
        run: ./scripts/fetch-piper.ps1

      - name: Fetch Vosk speech models
        shell: pwsh
        run: ./scripts/fetch-vosk.ps1

      - name: Fetch sherpa-onnx library (Parakeet dictation)
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/fetch-sherpa.ps1

      - name: Build, sign & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Filet de sécurité si l'image épinglée finit par embarquer un MSVC
          # récent : la crate `cc` ajoute ces drapeaux aux compilations C++.
          # Sans eux, les en-têtes fmt de DuckDB échouent sur « inline variables
          # require at least /std:c++17 » et sur l'absence de /EHsc.
          CXXFLAGS: "/EHsc /std:c++17"
        with:
          # STT inclus d'office (libvosk liée au build, DLL bundlées via tauri.conf.json).
          # Les voix Piper et modèles Vosk ne sont PAS bundlés : téléchargés à la
          # demande par l'app (Config → Audio / Voix, cf. commands/assets.rs).
          tagName: ${{ github.ref_name }}
          releaseName: "LMU Stats Viewer ${{ github.ref_name }}"
          releaseBody: |
            Notes de version : voir l'onglet « Notes de version » dans l'application.

            ## Installation Windows
            Télécharger l'installeur `.exe` (NSIS) ci-dessous et le lancer.

            ⚠️ Au premier lancement, Windows SmartScreen peut afficher un
            avertissement (binaire non signé par un certificat payant) :
            cliquer sur « Informations complémentaires » puis « Exécuter quand même ».

            Les mises à jour suivantes seront proposées automatiquement dans l'application.
          releaseDraft: true
          prerelease: false
