<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilote — LMU Stats Viewer</title>
<meta name="theme-color" content="#D93B00">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=42">
<link rel="icon" href="/favicon.ico?v=42">
<link rel="apple-touch-icon" href="/assets/icon-128.png?v=42">
<link rel="stylesheet" href="/assets/site.css?v=42">
</head>
<body>
<header class="site-header"></header>
<main id="pilote" class="wrap" style="padding-bottom:80px">
  <p class="crumbs"><a href="/" data-i18n="crumbs"></a> › <span data-i18n="profile.kicker"></span></p>
  <div id="notice"></div>

  <!-- En-tête au format des cartes circuit (accueil, page d'un classement, app). -->
  <section class="cgroup combo-head" id="head" hidden>
    <div class="cg-head cg-static"><span class="cg-name" data-i18n="profile.kicker"></span><span class="cg-drivers" id="headTag"></span></div>
    <div class="combo-hero">
      <div class="profile-id">
        <div class="avatar" id="avatar"></div>
        <div class="combo-title">
          <h1 id="name"></h1>
          <p class="muted" data-i18n="profile.sub"></p>
          <div class="profile-me" id="meBox"></div>
        </div>
      </div>
      <div class="kpis">
        <div class="kpi"><span data-i18n="profile.k.combos"></span><b class="mono" id="k-combos">—</b></div>
        <div class="kpi"><span data-i18n="profile.k.ranked"></span><b class="mono" id="k-ranked">—</b></div>
        <div class="kpi best"><span data-i18n="profile.k.records"></span><b class="mono" id="k-records">—</b></div>
        <div class="kpi"><span data-i18n="profile.k.podiums"></span><b class="mono" id="k-podiums">—</b></div>
        <div class="kpi"><span data-i18n="profile.k.best"></span><b id="k-best">—</b></div>
      </div>
    </div>
  </section>

  <div class="tbar board-bar lb-bar" id="bar" hidden><h3 data-i18n="profile.positions"></h3><span class="tbar-n" id="tbarCount"></span></div>
  <div class="board-body" id="groups"></div>
</main>
<footer class="site-footer"></footer>
<script src="/assets/site.js?v=42"></script>
<script src="/assets/pilote.js?v=42"></script>
</body>
</html>
