<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classements communautaires — LMU Stats Viewer</title>
<meta name="description" content="Les meilleurs tours des pilotes LMU Stats Viewer sur Le Mans Ultimate, circuit par circuit, par classe, voiture et version du jeu.">
<meta name="theme-color" content="#D93B00">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=43">
<link rel="icon" href="/favicon.ico?v=43">
<link rel="apple-touch-icon" href="/assets/icon-128.png?v=43">
<meta property="og:title" content="Classements communautaires — LMU Stats Viewer">
<meta property="og:description" content="Où vous situez-vous, circuit par circuit ? Des temps enregistrés par le jeu, pas saisis à la main.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/assets/site.css?v=43">
</head>
<body>
<header class="site-header"></header>

<main>
  <!-- Accueil = les classements, tout de suite : un en-tête court, puis le tableau
       circuits × classes où chaque temps ouvre son classement. -->
  <section class="intro">
    <div class="wrap intro-grid">
      <div class="intro-text">
        <h1 data-i18n="home.title"></h1>
        <p class="lead" data-i18n="home.lead"></p>
        <p class="intro-trust muted" data-i18n="home.trust"></p>
      </div>
      <div class="intro-side">
        <ul class="kstats" id="stats">
          <li><b class="skeleton">000</b><span data-i18n="stat.drivers"></span><em></em></li>
          <li><b class="skeleton">000</b><span data-i18n="stat.sessions"></span><em></em></li>
          <li><b class="skeleton">00</b><span data-i18n="stat.layouts"></span><em></em></li>
          <li><b class="skeleton">00</b><span data-i18n="stat.ranked"></span><em></em></li>
        </ul>
        <div class="intro-actions">
          <a class="btn btn-primary btn-sm" id="meLink" hidden data-i18n="home.me"></a>
          <a class="btn btn-ghost btn-sm" href="#how" data-i18n="nav.share"></a>
        </div>
      </div>
    </div>
  </section>

  <div class="topfilters"><div class="wrap"><div class="filters" id="filters"></div></div></div>

  <div class="wrap" id="notice"></div>

  <section class="board" id="tracks">
    <div class="wrap">
      <div class="tbar board-bar">
        <h3 data-i18n="home.board"></h3>
        <span class="tbar-right">
          <b class="tbar-n" id="resultsCount"></b>
          <span class="seg" role="group" id="sortSeg"><button type="button" data-sort="popular" data-i18n="sort.popular"></button><button type="button" data-sort="az" data-i18n="sort.az"></button></span>
          <span class="seg" role="group" id="viewSeg"><button type="button" data-view="grid" data-i18n="view.grid"></button><button type="button" data-view="list" data-i18n="view.list"></button></span>
          <a class="btn btn-sm" href="/" id="resetBtn" hidden data-i18n="f.reset"></a>
        </span>
      </div>
      <div id="board" class="board-body">
        <div class="panel sk-panel"><div class="sk-line skeleton"></div><div class="sk-line skeleton"></div><div class="sk-line skeleton"></div></div>
        <div class="panel sk-panel"><div class="sk-line skeleton"></div><div class="sk-line skeleton"></div></div>
      </div>
      <p class="board-legend muted" data-i18n="mx.legend"></p>
    </div>
  </section>

  <section class="section section-tight" id="how">
    <div class="wrap">
      <div class="section-head">
        <p class="kicker" data-i18n="how.kicker"></p>
        <h2 data-i18n="how.title"></h2>
      </div>
      <div class="how">
        <div class="panel"><span class="n">1</span><h3 data-i18n="how.0t"></h3><p class="muted" data-i18n="how.0d"></p><a class="btn btn-primary btn-sm" href="https://lmustatsviewer.cparfait.ovh/" data-i18n="how.0cta"></a></div>
        <div class="panel"><span class="n">2</span><h3 data-i18n="how.1t"></h3><p class="muted" data-i18n="how.1d"></p></div>
        <div class="panel"><span class="n">3</span><h3 data-i18n="how.2t"></h3><p class="muted" data-i18n="how.2d"></p></div>
        <div class="panel"><span class="n">4</span><h3 data-i18n="how.3t"></h3><p class="muted" data-i18n="how.3d"></p></div>
      </div>
      <div class="privacy-note">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span data-i18n="privacy"></span>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script src="/assets/site.js?v=43"></script>
<script src="/assets/home.js?v=43"></script>
</body>
</html>
