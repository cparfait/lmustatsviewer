<title>LMU Stats Viewer — Régie</title>
<style>
  /* Thème de l'app (clair par défaut, sombre au choix), envoyé par le serveur : mêmes couleurs que LMU Stats Viewer. */
  :root { --bg:#f4f5f8; --panel:#ffffff; --line:#d8dae2; --fg:#0b0f1e; --mute:#5a6070; --acc:#D93B00; --acct:#D93B00; --ok:#00c896; --bad:#FF1D43;
    --soft:rgba(217,59,0,.10); --road:#c3c8d4; --scrim:rgba(11,15,30,.45); --lostbg:#ffe4e8; --lostfg:#9f1239; color-scheme:light; }
  [data-theme="dark"] { --bg:#0b101f; --panel:#131a30; --line:#242e48; --fg:#d9dde6; --mute:#8e96aa; --acct:#e06a3e;
    --soft:rgba(224,106,62,.14); --road:#2b3550; --scrim:rgba(0,0,0,.55); --lostbg:#3b1219; --lostfg:#fecaca; color-scheme:dark; }
  :root { --z:1;
    --st:env(safe-area-inset-top, 0px); --sr:env(safe-area-inset-right, 0px); --sb:env(safe-area-inset-bottom, 0px); --sl:env(safe-area-inset-left, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Tout est en rem : le réglage « Taille du texte » agit sur --z. */
  html { font-size: calc(15px * var(--z)); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overscroll-behavior:none; }
  body { overflow:hidden; font:1rem/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .meta { color:var(--mute); font-size:.87rem; }
  .hidden { display:none !important; }
  .ico { width:1.25em; height:1.25em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ── Mise en page : en-tête, onglets, actions, contenu (seul le contenu défile) ── */
  #app { height:100%; height:100dvh; display:grid; grid-template-columns:minmax(0,1fr) auto auto; grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"hd nav act" "main main main" "dots dots dots"; padding:0 var(--sr) var(--sb) var(--sl); touch-action:pan-y; }
  header { grid-area:hd; display:flex; align-items:center; gap:.6rem; padding:calc(.4rem + var(--st)) .8rem .4rem; min-width:0; }
  header .title { font-weight:700; letter-spacing:.02em; white-space:nowrap; }
  #hdr { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #live { width:.55rem; height:.55rem; border-radius:50%; background:var(--line); flex:none; }
  #live.ok { background:var(--ok); }
  #live.bad { background:var(--bad); }
  #tabs { grid-area:nav; display:flex; gap:.4rem; align-items:center; padding:calc(.4rem + var(--st)) .4rem .4rem; }
  #tabs button { display:flex; align-items:center; gap:.4rem; background:var(--panel); border:1px solid var(--line); border-radius:.55rem; padding:.35rem .8rem; min-height:40px; font-size:.93rem; white-space:nowrap; }
  #tabs button.on { border-color:var(--acc); color:var(--acct); }
  .act { grid-area:act; display:flex; gap:.4rem; align-items:center; padding:calc(.4rem + var(--st)) .8rem .4rem 0; }
  .act button { display:flex; align-items:center; gap:.4rem; background:var(--panel); border:1px solid var(--line); border-radius:.55rem; padding:.35rem .7rem; min-height:40px; min-width:40px; justify-content:center; font-size:.93rem; }
  :fullscreen #fs, .standalone #fs { display:none; }
  main { grid-area:main; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:.65rem; border-top:1px solid var(--line); }
  main.full { display:flex; flex-direction:column; }
  #dots { grid-area:dots; display:flex; justify-content:center; gap:8px; padding:6px 0 10px; }
  #dots i { width:8px; height:8px; border-radius:50%; background:var(--line); }
  #dots i.on { background:var(--acc); }
  main.in-r { animation:inR .18s ease-out; }
  main.in-l { animation:inL .18s ease-out; }
  @keyframes inR { from { transform:translateX(28px); opacity:.35; } to { transform:none; opacity:1; } }
  @keyframes inL { from { transform:translateX(-28px); opacity:.35; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { main.in-r, main.in-l { animation:none; } }

  /* Téléphone tenu en hauteur : onglets en bas (à portée du pouce), sans points. */
  @media (max-width: 760px) {
    #app { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"hd act" "main main" "nav nav"; }
    header .title, .act .lbl-txt, #dots { display:none; }
    #tabs { justify-content:space-around; gap:0; padding:.15rem .25rem; border-top:1px solid var(--line); }
    #tabs button { flex:1 1 0; flex-direction:column; gap:2px; background:transparent; border:0; border-radius:0; min-height:52px; padding:.25rem .1rem; font-size:.75rem; color:var(--mute); }
    #tabs button.on { color:var(--acct); box-shadow:inset 0 2px 0 var(--acc); }
    #tabs .ico { width:1.45em; height:1.45em; }
    main { padding:.5rem; }
  }
  /* Tablette en portrait : la place va au circuit et au temps restant. */
  @media (min-width: 761px) and (max-width: 1100px) {
    header .title, .act .lbl-txt { display:none; }
    #tabs { gap:.3rem; }
    #tabs button { padding:.35rem .6rem; }
  }
  @media (min-width: 761px) and (max-width: 1000px) { #tabs .ico { display:none; } }
  /* Téléphone couché / petite hauteur : une seule barre fine en haut. */
  @media (min-width: 761px) and (max-height: 520px) {
    header .title, .act .lbl-txt, #dots { display:none; }
    header, #tabs, .act { padding-top:calc(.2rem + var(--st)); padding-bottom:.2rem; }
    #tabs button, .act button { min-height:36px; padding:.2rem .6rem; }
    #tabs .ico { display:none; }
    main { padding:.45rem; }
  }

  /* ── Cartes, grilles, chiffres ── */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:.65rem .8rem; overflow-x:auto; min-width:0; }
  .grid { display:grid; gap:.65rem; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5rem), 1fr)); }
  @media (max-width: 420px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lbl { color:var(--mute); font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; }
  .big { font-size:clamp(1.35rem, calc(4.6vmin * var(--z)), 2.6rem); font-weight:800; line-height:1.15; }
  .huge { font-size:clamp(2.2rem, calc(10vmin * var(--z)), 5rem); font-weight:800; line-height:1; }
  .ell { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .empty { margin:18vh auto 0; text-align:center; color:var(--mute); font-size:1.1rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:.3rem .4rem; text-align:left; white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  tr + tr td { border-top:1px solid var(--line); }
  tr.me td { background:var(--soft); }
  .cls { display:inline-block; min-width:3.4rem; text-align:center; border-radius:5px; padding:1px 5px; font-size:.8rem; font-weight:700; color:#fff; }
  .pit { color:var(--acct); font-weight:700; font-size:.8rem; margin-right:.3rem; }
  .r { text-align:right; }
  .c-drv { max-width:16rem; overflow:hidden; text-overflow:ellipsis; }
  /* Colonnes « selon l'écran » : les moins utiles disparaissent d'abord (réglage « Toutes » = tableau complet). */
  @media (max-width: 900px) { .cols-auto .c-laps, .cols-auto .c-pits { display:none; } }
  @media (max-width: 640px) {
    .cols-auto .c-int, .cols-auto .c-best, .cols-auto .c-pos { display:none; }
    .cols-auto .c-drv { max-width:30vw; }
    .cols-auto .cls { min-width:0; }
    .cols-auto .cls .full { display:none; }
    .cols-auto .cls .short { display:inline; }
    .cols-auto table.tt { font-size:.9rem; }
    .cols-auto table.tt th, .cols-auto table.tt td { padding:.3rem .25rem; }
  }
  .cls .short { display:none; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .wheels { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:.6rem; }
  @media (max-width: 640px) { .wheels { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .flag { display:inline-block; padding:2px 10px; border-radius:6px; font-weight:800; color:#000; }
  .leadrow { display:flex; flex-wrap:wrap; align-items:center; gap:.2rem .5rem; font-size:1.3rem; margin:.4rem 0; }
  .who { font-size:1.3rem; font-weight:700; }
  .sect td:first-child { max-width:9rem; overflow:hidden; text-overflow:ellipsis; }
  svg.map { width:100%; height:auto; display:block; margin:0 auto; }
  /* Ma voiture épinglée en tête du classement. */
  .mine { border-color:var(--acc); margin-bottom:.65rem; }
  .mine table td { font-size:1.13rem; font-weight:700; }
  .mine tr.me td { background:transparent; }
  /* Page Carte : la carte seule, sur toute la hauteur disponible. */
  .mapOnly { flex:1; min-height:0; padding:4px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .mapOnly svg.map { height:100%; }

  /* ── Connexion ── */
  #login { height:100%; overflow:auto; padding:calc(12vh + var(--st)) calc(12px + var(--sr)) 12px calc(12px + var(--sl)); }
  #login > div { max-width:340px; margin:0 auto; text-align:center; }
  #login input { font-size:2rem; letter-spacing:.3em; width:100%; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  #login button { margin-top:12px; width:100%; padding:12px; font-size:1.2rem; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:700; min-height:48px; }
  .err { color:var(--bad); min-height:1.4em; margin-top:8px; }
  .logo { width:72px; height:72px; border-radius:16px; display:block; margin:0 auto .6rem; }
  .brand { font-weight:800; font-size:1.35rem; letter-spacing:.01em; }
  #login h2 { margin:.15rem 0 .2rem; font-size:1.05rem; font-weight:600; color:var(--acct); text-transform:uppercase; letter-spacing:.08em; }
  .hlogo { width:22px; height:22px; border-radius:5px; flex:none; }

  /* ── Connexion perdue, message, réglages ── */
  #app.stale main { opacity:.45; filter:grayscale(.6); }
  #lost { position:fixed; left:50%; top:calc(3.6rem + var(--st)); transform:translateX(-50%); z-index:15; background:var(--lostbg); color:var(--lostfg); border:1px solid var(--bad); border-radius:999px; padding:.45rem 1rem; font-weight:600; white-space:nowrap; max-width:calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; }
  #toast { position:fixed; left:50%; bottom:calc(5rem + var(--sb)); transform:translateX(-50%); z-index:25; background:var(--panel); border:1px solid var(--acc); border-radius:.8rem; padding:.7rem 1rem; width:min(92vw, 440px); text-align:center; }
  #sheet { position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; }
  #sheet .panel { background:var(--panel); border:1px solid var(--line); border-radius:1rem 1rem 0 0; width:min(520px, 100%); max-height:88dvh; overflow:auto;
    padding:1rem calc(1rem + var(--sr)) calc(1rem + var(--sb)) calc(1rem + var(--sl)); }
  @media (min-width: 761px) { #sheet { align-items:center; } #sheet .panel { border-radius:1rem; padding-bottom:1rem; } }
  #sheet h3 { margin:0 0 .4rem; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.55rem 0; border-top:1px solid var(--line); }
  .seg { display:flex; gap:.35rem; align-items:center; flex:none; }
  .seg button, .wide { background:var(--bg); border:1px solid var(--line); border-radius:.55rem; min-height:44px; min-width:44px; padding:.3rem .7rem; }
  .seg button.on { border-color:var(--acc); color:var(--acct); }
  .sw { width:52px; height:30px; border-radius:15px; border:1px solid var(--line); background:var(--bg); position:relative; flex:none; padding:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--mute); transition:left .15s; }
  .sw[aria-pressed="true"] { background:var(--soft); border-color:var(--acc); }
  .sw[aria-pressed="true"]::after { left:25px; background:var(--acc); }
  .wide { width:100%; margin-top:.6rem; }
  /* Téléphone couché : réglages sur deux colonnes, boutons côte à côte, sans dépasser l'écran. */
  @media (max-height: 520px) {
    #sheet { align-items:center; padding:calc(6px + var(--st)) calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl)); }
    #sheet .panel { width:min(780px, 100%); max-height:100%; border-radius:1rem; padding:.6rem 1rem .7rem;
      display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:1.6rem; align-content:start; }
    #sheet h3 { grid-column:1 / -1; margin-bottom:.2rem; }
    .row { padding:.3rem 0; gap:.6rem; }
    .seg button { min-height:38px; min-width:40px; padding:.2rem .55rem; }
    .btns { grid-column:1 / -1; display:flex; gap:.6rem; }
    .btns .wide { margin-top:.5rem; min-height:40px; }
  }
  /* Plein écran : sans menus ; un toucher les affiche quelques secondes. */
  html.bare #app { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); grid-template-areas:"main"; }
  html.bare header, html.bare #tabs, html.bare .act, html.bare #dots { display:none; }
  html.bare main { border-top:0; padding-top:calc(.5rem + var(--st)); }
  html.bare #lost { top:calc(.6rem + var(--st)); }
  /* Vidéo muette qui garde l'écran allumé (repli sans API Wake Lock) : invisible, sans clic. */
  video.wake { position:fixed; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; z-index:-1; }
</style>
</head>

      const [x, y] = P([s.pos_x, s.pos_z]); const me = s.is_player; const r = me ? rMe : rCar;
      return `<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${me ? "#ffb400" : classColor(s.vehicle_class)}" style="stroke:var(--panel)" stroke-width="${(r * 0.25).toFixed(1)}"/>` +
        `<text x="${x.toFixed(1)}" y="${(y + r * 0.36).toFixed(1)}" text-anchor="middle" font-size="${(r * 1.05).toFixed(1)}" font-weight="700" fill="#0a0e1a">${s.class_position || s.position}</text></g>`;
    }).join("");
    return `<svg class="map" viewBox="0 0 ${W} ${H}" style="${style || ""}">${pitSvg}<path d="${path(pts, true)}" fill="none" style="stroke:var(--road)" stroke-width="${road.toFixed(1)}" stroke-linejoin="round"/>${cars}</svg>`;
  }
  const viewBox = () => { const v = $("view"); return { w: Math.max(200, v.clientWidth - 24), h: Math.max(200, v.clientHeight - 24) }; };

  // ── Gabarits ─────────────────────────────────────────────────────────────
  const me = (d) => (d.standings || []).find((s) => s.is_player);
  const classOrder = (d) => { const seen = []; for (const s of d.standings || []) if (!seen.includes(s.vehicle_class)) seen.push(s.vehicle_class); return seen; };
  const remaining = (d) => { const sc = d.session || {}; return sc.end_et > 0 ? clock(Math.max(0, sc.end_et - sc.session_time)) : sc.max_laps > 0 && sc.max_laps < 1000 ? `${sc.max_laps} ${T.laps.toLowerCase()}` : clock(sc.session_time); };
  const classMates = (d, p) => (d.standings || []).filter((s) => s.vehicle_class === p.vehicle_class).sort((a, b) => a.class_position - b.class_position);

  function timingTable(d, rows) {
    const leaders = {}; for (const s of d.standings || []) if (s.class_position === 1) leaders[s.vehicle_class] = s;
    return `<table class="mono tt"><tr><th class="c-pos">${T.pos}</th><th>${T.cls}</th><th class="c-drv">${T.driver}</th><th class="r">${T.gap}</th><th class="r c-int">${T.int}</th><th class="r">${T.last}</th><th class="r c-best">${T.best}</th><th class="r c-laps">${T.laps}</th><th class="r c-pits">${T.pits}</th></tr>` +
      rows.map((s) => `<tr class="${s.is_player ? "me" : ""}"><td class="c-pos">${s.position}</td><td>${clsTag(s.vehicle_class)} ${s.class_position}</td><td class="c-drv">${s.in_pits ? `<span class="pit">${T.inPit}</span>` : ""}${esc(s.driver)}</td>` +
        `<td class="r">${gapOf(s, leaders[s.vehicle_class])}</td><td class="r c-int">${s.position > 1 ? "+" + (s.time_behind_next || 0).toFixed(1) : T.none}</td>` +
        `<td class="r">${lapT(s.last_lap_time)}</td><td class="r c-best">${lapT(s.best_lap_time)}</td><td class="r c-laps">${s.total_laps}</td><td class="r c-pits">${s.num_pitstops}</td></tr>`).join("") + `</table>`;
  }

  // 1. Classement complet (multiclasse, couleurs de classe), ma voiture épinglée en tête.
  function tplTiming(d) {
    const p = me(d);
    const mine = p ? `<div class="card mine"><div class="lbl">${T.mine}</div>${timingTable(d, [p])}</div>` : "";
    return `${mine}<div class="card">${timingTable(d, d.standings || [])}</div>`;
  }

  // 2. Ingénieur : tout ce qui concerne la voiture du joueur.
  function tplEngineer(d) {
    const p = me(d); const tel = d.telemetry; const w = d.weather || {}; const x = d.extended || {};
    if (!p || !tel) return `<div class="empty">${T.noPlayer}</div>`;
    const cls = classMates(d, p); const i = cls.indexOf(p); const a = cls[i - 1], b = cls[i + 1];
    const wheels = (tel.wheels || []).map((wh, k) => `<div><div class="lbl">${["FL","FR","RL","RR"][k]}</div><div class="mono">${Math.round(wh.temp)}°C · ${Math.round(wh.wear)}%</div><div class="bar"><i style="width:${Math.max(0, Math.min(100, wh.wear))}%"></i></div></div>`).join("");
    const v = d.rest && d.rest.vehicle && d.rest.vehicle.state === "fresh" ? d.rest.vehicle.data : null;
    const pads = v && v.brake_condition && v.brake_condition.length === 4 ? v.brake_condition.map((q) => Math.round(Math.min(1, q) * 100) + "%").join(" · ") : T.none;
    return `<div class="grid g3">
      <div class="card"><div class="lbl">${T.pos}</div><div class="huge mono">P${p.class_position}</div><div class="meta">${clsTag(p.vehicle_class)} · P${p.position}</div></div>
      <div class="card"><div class="lbl">${T.remaining}</div><div class="big mono">${remaining(d)}</div><div class="meta">${T.lap} ${p.total_laps}</div></div>
      <div class="card"><div class="lbl">${T.ahead}</div><div class="big mono">${a ? "−" + Math.max(0, p.time_behind_leader - a.time_behind_leader).toFixed(1) : T.none}</div><div class="meta ell">${a ? esc(a.driver) : ""}</div></div>
      <div class="card"><div class="lbl">${T.behind}</div><div class="big mono">${b ? "+" + Math.max(0, b.time_behind_leader - p.time_behind_leader).toFixed(1) : T.none}</div><div class="meta ell">${b ? esc(b.driver) : ""}</div></div>
      <div class="card"><div class="lbl">${T.fuel}</div><div class="big mono">${(tel.fuel || 0).toFixed(1)} L</div><div class="meta">${tel.fuel_laps_remaining > 0 ? tel.fuel_laps_remaining.toFixed(1) + " " + T.lapsLeft : T.none}</div></div>
      <div class="card"><div class="lbl">${T.energy}</div><div class="big mono">${x.virtual_energy > 0 ? Math.round(x.virtual_energy * 100) + "%" : T.none}</div><div class="meta">${T.pads} ${pads}</div></div>
      <div class="card"><div class="lbl">${T.last} / ${T.best}</div><div class="big mono">${lapT(p.last_lap_time)}</div><div class="meta mono">${lapT(p.best_lap_time)}</div></div>
      <div class="card"><div class="lbl">${T.weather}</div><div class="mono">${T.air} ${Math.round(w.air_temp || 0)}° · ${T.track} ${Math.round(w.track_temp || 0)}°</div><div class="mono">${T.rain} ${Math.round((w.rain || 0) * 100)}%</div></div>
    </div><div class="card" style="margin-top:.65rem"><div class="lbl">${T.tyres}</div><div class="wheels">${wheels}</div></div>`;
  }

  // 3. Carte : le tracé et les voitures colorées par classe, rien d'autre.
  const tplMap = (d) => `<div class="card mapOnly">${mapSvg(d, viewBox())}</div>`;

  // 4. Duel : le joueur face aux voitures devant et derrière dans sa classe.
  function tplDuel(d) {
    const p = me(d);
    if (!p) return `<div class="empty">${T.noPlayer}</div>`;
    const cls = classMates(d, p); const i = cls.indexOf(p);
    const sec = (s) => `<td class="r">${(s.last_s1 || 0).toFixed(2)}</td><td class="r">${(s.last_s2 || 0).toFixed(2)}</td><td class="r">${(s.last_s3 || 0).toFixed(2)}</td>`;
    const col = (s, title, sign) => !s ? `<div class="card"><div class="lbl">${title}</div><div class="big">${T.none}</div></div>` :
      `<div class="card"><div class="lbl">${title}</div><div class="who ell">${esc(s.driver)}</div><div class="meta">${clsTag(s.vehicle_class)} P${s.class_position}</div>
       <div class="huge mono">${sign}${Math.abs(s.time_behind_leader - p.time_behind_leader).toFixed(1)}</div>
       <table class="mono sect"><tr><th></th><th class="r">${T.last}</th><th class="r">${T.best}</th></tr>
       <tr><td>${esc(s.driver)}</td><td class="r">${lapT(s.last_lap_time)}</td><td class="r">${lapT(s.best_lap_time)}</td></tr>
       <tr class="me"><td>${esc(p.driver)}</td><td class="r">${lapT(p.last_lap_time)}</td><td class="r">${lapT(p.best_lap_time)}</td></tr></table>
       <table class="mono sect" style="margin-top:.4rem"><tr><th>${T.sectors}</th><th class="r">S1</th><th class="r">S2</th><th class="r">S3</th></tr>
       <tr><td>${esc(s.driver)}</td>${sec(s)}</tr><tr class="me"><td>${esc(p.driver)}</td>${sec(p)}</tr></table></div>`;
    return `<div class="grid g2">${col(cls[i - 1], T.ahead, "−")}${col(cls[i + 1], T.behind, "+")}</div>`;
  }

  // 5. TV : temps restant en grand, leaders de chaque classe, carte.
  function tplTv(d) {
    const w = d.weather || {}; const f = d.flags || {};
    const phase = f.yellow_flag_state > 0 ? `<span class="flag" style="background:#facc15">FCY</span>` : `<span class="flag" style="background:#22c55e">GREEN</span>`;
    const leaders = classOrder(d).map((c) => (d.standings || []).find((s) => s.vehicle_class === c && s.class_position === 1)).filter(Boolean);
    const bx = viewBox(); const mh = Math.round(innerHeight * 0.55);
    return `<div class="grid g2"><div class="card"><div class="lbl">${T.remaining}</div><div class="huge mono">${remaining(d)}</div><div style="margin-top:8px">${phase}</div>
      <div class="meta" style="margin-top:8px">${T.air} ${Math.round(w.air_temp || 0)}° · ${T.track} ${Math.round(w.track_temp || 0)}° · ${T.rain} ${Math.round((w.rain || 0) * 100)}%</div></div>
      <div class="card"><div class="lbl">${T.leader}</div>${leaders.map((s) => `<div class="leadrow">${clsTag(s.vehicle_class)} <b>${esc(s.driver)}</b> <span class="meta">${esc(s.vehicle_name)}</span></div>`).join("")}</div>
      <div class="card" style="grid-column:1/-1">${mapSvg(d, { w: bx.w, h: Math.min(bx.h, mh) }, `max-height:${mh}px`)}</div></div>`;
  }

  function render() {
    const d = last; const v = $("view");
    // Pendant un geste, on attend la fin : le contenu ne saute pas sous le doigt.
    if (touching) { pending = true; return; }
    v.classList.toggle("full", tpl === "map");
    if (!d || !d.connected || !d.session) { $("hdr").textContent = T.offline; $("live").className = ""; v.innerHTML = `<div class="empty">${T.offline}</div>`; shownTpl = ""; return; }
    $("live").className = $("app").classList.contains("stale") ? "bad" : "ok";
    $("hdr").textContent = `${d.session.track} · ${remaining(d)}`;
    const f = { timing: tplTiming, engineer: tplEngineer, map: tplMap, duel: tplDuel, tv: tplTv }[tpl] || tplTiming;
    // Rafraîchi chaque seconde : défilements (vertical et tableaux) conservés.
    const same = shownTpl === tpl;
    const top = v.scrollTop, xs = [...v.querySelectorAll(".card")].map((c) => c.scrollLeft);
    v.innerHTML = f(d);
    if (same) { v.querySelectorAll(".card").forEach((c, i) => { if (xs[i]) c.scrollLeft = xs[i]; }); v.scrollTop = top; } else v.scrollTop = 0;
    shownTpl = tpl;
  }

  if (token) start(); else showLogin();
})();
</script>
</body>
</html>
