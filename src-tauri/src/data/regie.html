<!doctype html>
<html lang="fr" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LMU SV">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f5f8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>LMU Stats Viewer — Régie</title>
<style>
  /* Chiffres et libellés : Barlow Condensed (SIL OFL 1.1), servie par l'app
     (aucune connexion internet). Chiffres tabulaires, étroits : plus grands
     dans la même place. Repli : police système. */
  @font-face { font-family:"LMU Num"; font-style:normal; font-weight:500; font-display:block;
    src:url(/fonts/barlow-condensed-500.woff2) format("woff2"); }
  @font-face { font-family:"LMU Num"; font-style:normal; font-weight:600; font-display:block;
    src:url(/fonts/barlow-condensed-600.woff2) format("woff2"); }
  @font-face { font-family:"LMU Num"; font-style:normal; font-weight:700; font-display:block;
    src:url(/fonts/barlow-condensed-700.woff2) format("woff2"); }
  /* Thème de l'app (clair par défaut, sombre au choix), envoyé par le serveur : mêmes couleurs que LMU Stats Viewer. */
  :root { --bg:#f4f5f8; --panel:#ffffff; --line:#d8dae2; --fg:#0b0f1e; --mute:#5a6070; --acc:#D93B00; --acct:#D93B00; --ok:#00c896; --bad:#FF1D43;
    --soft:rgba(217,59,0,.10); --road:#c3c8d4; --scrim:rgba(11,15,30,.45); --lostbg:#ffe4e8; --lostfg:#9f1239; color-scheme:light; }
  [data-theme="dark"] { --bg:#0b101f; --panel:#131a30; --line:#242e48; --fg:#d9dde6; --mute:#8e96aa; --acct:#e06a3e;
    --soft:rgba(224,106,62,.14); --road:#2b3550; --scrim:rgba(0,0,0,.55); --lostbg:#3b1219; --lostfg:#fecaca; color-scheme:dark; }
  :root { --z:1;
    --st:env(safe-area-inset-top, 0px); --sr:env(safe-area-inset-right, 0px); --sb:env(safe-area-inset-bottom, 0px); --sl:env(safe-area-inset-left, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Tout est en rem : le réglage « Taille du texte » agit sur --z. */
  html { font-size: calc(15px * var(--z)); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overscroll-behavior:none; }
  body { overflow:hidden; font:1rem/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .meta { color:var(--mute); font-size:.87rem; }
  .hidden { display:none !important; }
  .ico { width:1.25em; height:1.25em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ── Mise en page : en-tête, onglets, actions, contenu (seul le contenu défile) ── */
  #app { height:100%; height:100dvh; display:grid; grid-template-columns:minmax(9rem,1fr) minmax(0,max-content) auto; grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"hd nav act" "main main main" "dots dots dots"; padding:0 var(--sr) var(--sb) var(--sl); touch-action:pan-y; }
  header { grid-area:hd; display:flex; align-items:center; gap:.6rem; padding:calc(.4rem + var(--st)) .8rem .4rem; min-width:0; }
  header .title { font-weight:700; letter-spacing:.02em; white-space:nowrap; }
  #hdr { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #live { width:.55rem; height:.55rem; border-radius:50%; background:var(--line); flex:none; }
  #live.ok { background:var(--ok); }
  #live.bad { background:var(--bad); }
  /* Onglets : seulement les écrans activés ; défilent en largeur s'ils sont nombreux. */
  #tabs { grid-area:nav; display:flex; gap:.4rem; align-items:center; padding:calc(.4rem + var(--st)) .4rem .4rem; overflow-x:auto; scrollbar-width:none; min-width:0; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs button { display:flex; align-items:center; gap:.4rem; background:var(--panel); border:1px solid var(--line); border-radius:.55rem; padding:.35rem .8rem; min-height:40px; font-size:.93rem; white-space:nowrap; }
  #tabs button.on { border-color:var(--acc); color:var(--acct); }
  .act { grid-area:act; display:flex; gap:.4rem; align-items:center; padding:calc(.4rem + var(--st)) .8rem .4rem 0; }
  .act button { display:flex; align-items:center; gap:.4rem; background:var(--panel); border:1px solid var(--line); border-radius:.55rem; padding:.35rem .7rem; min-height:40px; min-width:40px; justify-content:center; font-size:.93rem; }
  :fullscreen #fs, .standalone #fs { display:none; }
  main { grid-area:main; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:.65rem; border-top:1px solid var(--line); }
  #dots { grid-area:dots; display:flex; justify-content:center; gap:8px; padding:6px 0 10px; }
  #dots i { width:8px; height:8px; border-radius:50%; background:var(--line); }
  #dots i.on { background:var(--acc); }
  main.in-r { animation:inR .18s ease-out; }
  main.in-l { animation:inL .18s ease-out; }
  @keyframes inR { from { transform:translateX(28px); opacity:.35; } to { transform:none; opacity:1; } }
  @keyframes inL { from { transform:translateX(-28px); opacity:.35; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { main.in-r, main.in-l { animation:none; } }

  /* Téléphone tenu en hauteur : onglets en bas (à portée du pouce), sans points. */
  @media (max-width: 760px) {
    #app { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"hd act" "main main" "nav nav"; }
    header .title, .act .lbl-txt, #dots { display:none; }
    #tabs { justify-content:flex-start; gap:0; padding:.15rem .25rem; border-top:1px solid var(--line); }
    #tabs button { flex:1 0 4.4rem; flex-direction:column; gap:2px; background:transparent; border:0; border-radius:0; min-height:52px; padding:.25rem .1rem; font-size:.75rem; color:var(--mute); }
    #tabs button.on { color:var(--acct); box-shadow:inset 0 2px 0 var(--acc); }
    #tabs .ico { width:1.45em; height:1.45em; }
    main { padding:.5rem; }
  }
  /* Tablette : la place va au circuit et au temps restant ; avec beaucoup
     d'écrans, les onglets passent en icônes (libellé sur l'onglet actif). */
  @media (min-width: 761px) and (max-width: 1100px) {
    header .title, .act .lbl-txt { display:none; }
    #tabs { gap:.3rem; }
    #tabs button { padding:.35rem .6rem; }
  }
  @media (min-width: 761px) and (max-width: 1400px) {
    #tabs.many button:not(.on) span { display:none; }
    #tabs.many .ico { display:inline-block !important; }
    header .title { display:none; }
  }
  /* Téléphone couché / petite hauteur : une seule barre fine en haut. */
  @media (min-width: 761px) and (max-height: 520px) {
    header .title, .act .lbl-txt, #dots { display:none; }
    header, #tabs, .act { padding-top:calc(.2rem + var(--st)); padding-bottom:.2rem; }
    #tabs button, .act button { min-height:36px; padding:.2rem .6rem; }
    #tabs .ico { display:none; }
    main { padding:.45rem; }
  }

  /* ── Cartes, grilles, chiffres ── */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:.65rem .8rem; overflow-x:auto; min-width:0; }
  .lbl { color:var(--mute); font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; }
  .big { font-size:clamp(1.35rem, calc(4.6vmin * var(--z)), 2.6rem); font-weight:800; line-height:1.15; }
  .huge { font-size:clamp(2.2rem, calc(10vmin * var(--z)), 5rem); font-weight:800; line-height:1; }
  .ell { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .empty { margin:18vh auto 0; text-align:center; color:var(--mute); font-size:1.1rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:.3rem .4rem; text-align:left; white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:.8rem; text-transform:uppercase; }
  tr + tr td { border-top:1px solid var(--line); }
  tr.me td { background:var(--soft); }
  .cls { display:inline-block; min-width:3.4rem; text-align:center; border-radius:5px; padding:1px 5px; font-size:.8rem; font-weight:700; color:#fff; }
  .pit { color:var(--acct); font-weight:700; font-size:.8rem; margin-right:.3rem; }
  .r { text-align:right; }
  .c-drv { max-width:16rem; overflow:hidden; text-overflow:ellipsis; }
  /* Colonnes « selon l'écran » : les moins utiles disparaissent d'abord (réglage « Toutes » = tableau complet). */
  @media (max-width: 900px) { .cols-auto .c-laps, .cols-auto .c-pits { display:none; } }
  @media (max-width: 640px) {
    .cols-auto .c-int, .cols-auto .c-best, .cols-auto .c-pos { display:none; }
    .cols-auto .c-drv { max-width:30vw; }
    .cols-auto .cls { min-width:0; }
    .cols-auto .cls .full { display:none; }
    .cols-auto .cls .short { display:inline; }
    .cols-auto table.tt { font-size:.9rem; }
    .cols-auto table.tt th, .cols-auto table.tt td { padding:.3rem .25rem; }
  }
  .cls .short { display:none; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .wheels { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:.6rem; }
  @media (max-width: 640px) { .wheels { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .flag { display:inline-block; padding:2px 10px; border-radius:6px; font-weight:800; color:#000; }
  .leadrow { display:flex; flex-wrap:wrap; align-items:center; gap:.2rem .5rem; font-size:1.3rem; margin:.4rem 0; }
  .who { font-size:1.3rem; font-weight:700; }
  .sect td:first-child { max-width:9rem; overflow:hidden; text-overflow:ellipsis; }
  svg.map { width:100%; height:auto; display:block; margin:0 auto; }
  /* Ma voiture épinglée en tête du classement. */
  .mine { border-color:var(--acc); margin-bottom:.65rem; }
  .mine table td { font-size:1.13rem; font-weight:700; }
  .mine tr.me td { background:transparent; }

  /* ── Connexion ── */
  #login { height:100%; overflow:auto; padding:calc(12vh + var(--st)) calc(12px + var(--sr)) 12px calc(12px + var(--sl)); }
  #login > div { max-width:340px; margin:0 auto; text-align:center; }
  #login input { font-size:2rem; letter-spacing:.3em; width:100%; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  #login button { margin-top:12px; width:100%; padding:12px; font-size:1.2rem; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:700; min-height:48px; }
  .err { color:var(--bad); min-height:1.4em; margin-top:8px; }
  .logo { width:72px; height:72px; border-radius:16px; display:block; margin:0 auto .6rem; }
  .brand { font-weight:800; font-size:1.35rem; letter-spacing:.01em; }
  #login h2 { margin:.15rem 0 .2rem; font-size:1.05rem; font-weight:600; color:var(--acct); text-transform:uppercase; letter-spacing:.08em; }
  .hlogo { width:22px; height:22px; border-radius:5px; flex:none; }

  /* ── Connexion perdue, message, réglages ── */
  #app.stale main { opacity:.45; filter:grayscale(.6); }
  #lost { position:fixed; left:50%; top:calc(3.6rem + var(--st)); transform:translateX(-50%); z-index:15; background:var(--lostbg); color:var(--lostfg); border:1px solid var(--bad); border-radius:999px; padding:.45rem 1rem; font-weight:600; white-space:nowrap; max-width:calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; }
  #toast { position:fixed; left:50%; bottom:calc(5rem + var(--sb)); transform:translateX(-50%); z-index:25; background:var(--panel); border:1px solid var(--acc); border-radius:.8rem; padding:.7rem 1rem; width:min(92vw, 440px); text-align:center; }
  #sheet { position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; }
  #sheet .panel { background:var(--panel); border:1px solid var(--line); border-radius:1rem 1rem 0 0; width:min(520px, 100%); max-height:88dvh; overflow:auto;
    padding:1rem calc(1rem + var(--sr)) calc(1rem + var(--sb)) calc(1rem + var(--sl)); }
  @media (min-width: 761px) { #sheet { align-items:center; } #sheet .panel { border-radius:1rem; padding-bottom:1rem; } }
  #sheet h3 { margin:0 0 .4rem; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.55rem 0; border-top:1px solid var(--line); }
  .seg { display:flex; gap:.35rem; align-items:center; flex:none; }
  .seg button, .wide { background:var(--bg); border:1px solid var(--line); border-radius:.55rem; min-height:44px; min-width:44px; padding:.3rem .7rem; }
  .seg button.on { border-color:var(--acc); color:var(--acct); }
  .sw { width:52px; height:30px; border-radius:15px; border:1px solid var(--line); background:var(--bg); position:relative; flex:none; padding:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--mute); transition:left .15s; }
  .sw[aria-pressed="true"] { background:var(--soft); border-color:var(--acc); }
  .sw[aria-pressed="true"]::after { left:25px; background:var(--acc); }
  .wide { width:100%; margin-top:.6rem; }
  /* Téléphone couché : réglages sur deux colonnes, boutons côte à côte, sans dépasser l'écran. */
  @media (max-height: 520px) {
    #sheet { align-items:center; padding:calc(6px + var(--st)) calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl)); }
    #sheet .panel { width:min(780px, 100%); max-height:100%; border-radius:1rem; padding:.6rem 1rem .7rem;
      display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:1.6rem; align-content:start; }
    #sheet h3 { grid-column:1 / -1; margin-bottom:.2rem; }
    .row { padding:.3rem 0; gap:.6rem; }
    .seg button { min-height:38px; min-width:40px; padding:.2rem .55rem; }
    .btns { grid-column:1 / -1; display:flex; gap:.6rem; }
    .btns .wide { margin-top:.5rem; min-height:40px; }
  }
  /* Plein écran : sans menus ; un toucher les affiche quelques secondes. */
  html.bare #app { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); grid-template-areas:"main"; }
  html.bare header, html.bare #tabs, html.bare .act, html.bare #dots { display:none; }
  html.bare main { border-top:0; padding-top:calc(.5rem + var(--st)); }
  html.bare #lost { top:calc(.6rem + var(--st)); }
  /* Choix des écrans (réglages). */
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; padding:.2rem 0 .6rem; }
  .chips button { display:flex; align-items:center; gap:.35rem; background:var(--bg); border:1px solid var(--line); border-radius:999px; min-height:40px; padding:.25rem .8rem; color:var(--mute); }
  .chips button.on { border-color:var(--acc); color:var(--acct); background:var(--soft); }
  @media (max-height: 520px) { .scr, .scr-h { grid-column:1 / -1; } }
  /* Pédales. */
  .ped { display:grid; gap:.65rem; grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .ped .trace { grid-column:1 / -1; }
  .pbars { display:flex; gap:.8rem; justify-content:center; align-items:flex-end; }
  .pbar { display:flex; flex-direction:column; align-items:center; gap:.3rem; flex:1; min-width:0; }
  .pbar .lbl { font-size:.7rem; letter-spacing:.04em; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tube { width:100%; max-width:3.4rem; height:clamp(7rem, 34vh, 18rem); background:var(--line); border-radius:.5rem; position:relative; overflow:hidden; }
  .tube i { position:absolute; left:0; right:0; bottom:0; height:0; }
  .gear { font-size:clamp(4rem, calc(18vmin * var(--z)), 9rem); font-weight:800; line-height:1; text-align:center; }
  .rpm { height:12px; border-radius:6px; background:var(--line); overflow:hidden; }
  .rpm i { display:block; height:100%; width:0; }
  .steer { position:relative; height:12px; border-radius:6px; background:var(--line); margin-top:.3rem; }
  .steer::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--mute); }
  .steer i { position:absolute; top:-3px; left:50%; width:8px; height:18px; margin-left:-4px; border-radius:3px; background:var(--acc); }
  .trace svg { width:100%; height:clamp(6rem, 22vh, 12rem); display:block; }
  .kv { display:flex; flex-wrap:wrap; gap:.25rem 1rem; }
  /* Drapeaux & stands. */
  .flagbig { grid-column:1 / -1; border-radius:.8rem; padding:clamp(1rem, 4vmin, 2rem); text-align:center; font-weight:800; font-size:clamp(1.8rem, calc(8vmin * var(--z)), 4rem); letter-spacing:.03em; color:#000; }
  .flagbig .sub { font-size:1.05rem; font-weight:700; margin-top:.3rem; opacity:.85; }
  .chk { background:repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 44px 44px; color:#fff; text-shadow:0 0 6px #000, 0 0 2px #000; }
  .pill { display:inline-block; padding:.3rem .8rem; border-radius:999px; font-weight:800; }
  .menu td { padding:.2rem .4rem; white-space:normal; }
  /* Pneus & freins : disposition de la voiture (avant en haut). */
  .car4 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.65rem; }
  .t3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:3px; margin:.35rem 0; }
  .t3 span { text-align:center; border-radius:4px; padding:.3rem 0; font-weight:800; }
  .rel td { font-size:1.1rem; padding:.45rem .4rem; }
  /* ── Pages tableau de bord : elles remplissent toute la zone, sans déborder ──
     Chaque case est un conteneur : son texte suit SA taille (unités cq ; repli en
     rem pour les navigateurs plus anciens). --z = réglage « Taille du texte » ;
     --fk = réduction posée par le rendu si une case ne tient pas (jusqu'à 62 %),
     puis, en dernier recours, la page défile (main.grow) au lieu de couper.
     Disposition selon la forme de la zone (data-shape : port = plus haute que
     large, land = paysage, wide = très large, ex. téléphone couché). */
  main.fit { display:flex; flex-direction:column; container-type:size; }
  main.fit.tight { padding:.4rem; }
  /* Hauteur définie (celle de la zone) : les « fr » se partagent la place réelle. */
  .page { flex:none; height:100%; display:grid; gap:.6rem; grid-template-columns:minmax(0, 1fr); }
  main.tight .page { gap:.4rem; }
  .page > * { min-width:0; min-height:0; }
  .page > .card, .page > .flagbig { container-type:size; overflow:hidden; }
  .page > .card { display:flex; flex-direction:column; justify-content:center; }
  main.tight .page > .card { padding:.4rem .55rem; }
  main.grow .page { height:auto; min-height:100%; }
  main.grow .page > .card, main.grow .page > .flagbig { container-type:inline-size; overflow:visible; }
  .page .lbl { font-size:.8rem; font-size:calc(clamp(.64rem, calc(8cqmin * var(--z)), 1.05rem) * var(--fk, 1)); }
  .page .meta { font-size:.87rem; font-size:calc(clamp(.72rem, calc(10cqmin * var(--z)), 1.25rem) * var(--fk, 1)); }
  .page .txt { font-size:.95rem; font-size:calc(clamp(.76rem, calc(min(10cqmin, 5.2cqw) * var(--z)), 1.45rem) * var(--fk, 1)); }
  .page .big { font-size:1.6rem; font-size:calc(clamp(1rem, calc(min(34cqmin, 21cqw) * var(--z)), 5.5rem) * var(--fk, 1)); }
  .page .huge { font-size:3rem; font-size:calc(clamp(1.5rem, calc(min(56cqmin, 36cqw) * var(--z)), 10rem) * var(--fk, 1)); }
  .mapslot { position:relative; overflow:hidden; padding:0; min-height:8rem; }
  .mapslot svg.map { position:absolute; inset:4px; width:calc(100% - 8px); height:calc(100% - 8px); }

  /* Ingénieur : 8 cases + pneus. */
  .eng { grid-template-columns:repeat(2, minmax(0, 1fr)); grid-template-rows:repeat(4, 1fr) 1.3fr; }
  main:not([data-shape="port"]) .eng { grid-template-columns:repeat(4, minmax(0, 1fr)); grid-template-rows:1fr 1fr .9fr; }
  .eng .tyc { grid-column:1 / -1; }
  .eng .wheels { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:.3rem .8rem; }
  main:not([data-shape="port"]) .eng .wheels { grid-template-columns:repeat(4, minmax(0, 1fr)); }
  .eng .tyc .txt { font-size:calc(clamp(.76rem, calc(min(14cqh, 3.4cqw) * var(--z)), 1.5rem) * var(--fk, 1)); }
  /* Drapeaux & stands. */
  .flg { grid-template-rows:.75fr 1fr 1.5fr; }
  main[data-shape="land"] .flg { grid-template-columns:repeat(2, minmax(0, 1fr)); grid-template-rows:.8fr 1.6fr; }
  main[data-shape="wide"] .flg { grid-template-columns:repeat(3, minmax(0, 1fr)); grid-template-rows:1fr; }
  main[data-shape="wide"] .flg .flagbig { grid-column:auto; }
  .flg .flagbig { display:flex; flex-direction:column; justify-content:center; align-items:center; padding:.6rem; line-height:1.1;

  #tabs button.on { background:var(--soft); color:var(--acct); border-color:transparent; font-weight:600; }
  .act button { border-radius:999px; background:var(--bg); border-color:transparent; }
  /* Téléphone : barre d'onglets du bas avec pastille derrière l'icône (Material 3). */
  @media (max-width: 760px) {
    #tabs { background:var(--panel); padding:.3rem .2rem .25rem; }

  // Menus masqués en plein écran (ou ouverte depuis l'écran d'accueil) : un toucher
  // sur le contenu les affiche 4 s ; le balayage change toujours de page.
  let barsShown = false, barsTimer = 0, tapHinted = false;
  function updBars() {
    const bare = !!P.bars && !!(fsEl() || standalone) && !barsShown && !$("app").classList.contains("hidden");
    if (bare === document.documentElement.classList.contains("bare")) return;
    document.documentElement.classList.toggle("bare", bare);
    if (bare && !tapHinted) { tapHinted = true; toast(T.tapMenu); }
    reflow();
  }
  function showBars() {
    barsShown = true; updBars(); clearTimeout(barsTimer);
    barsTimer = setTimeout(() => { if (sheetOpen()) return showBars(); barsShown = false; updBars(); }, 4000);
  }
  $("view").addEventListener("click", () => { if (document.documentElement.classList.contains("bare")) showBars(); });
  ["header", "#tabs", ".act"].forEach((q) => document.querySelector(q).addEventListener("pointerdown", () => { if (barsShown) showBars(); }));
  addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" && document.documentElement.classList.contains("bare")) showBars(); });
  const onFs = () => { barsShown = false; clearTimeout(barsTimer); updBars(); lockOrientation(); };
  document.addEventListener("fullscreenchange", onFs);
  document.addEventListener("webkitfullscreenchange", onFs);

  // Écran allumé : API Wake Lock si la page y a droit (HTTPS / localhost) ;
  // sinon une vidéo muette de 2 s en boucle, invisible (page servie en HTTP
  // sur le réseau local, cas courant). La vidéo est noire, 16 × 16, 848 octets.
  const WAKE = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMHbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAB9AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAlZ0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAB9AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAfQAAAAAAABAAAAAAHObWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAgABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABeW1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAATlzdGJsAAAAuXN0c2QAAAAAAAAAAQAAAKlhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABDExhdmMgbGlieDI2NAAAAAAAAAAAAAAAAAAAAAAAAAAAGP//AAAAL2F2Y0MBQsAe/+EAFmdCwB7ZHsBEAAADAAQAAAMACDxYuSABAAZoy4BlLIAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAAZAAAAAAAAAAYc3R0cwAAAAAAAAABAAAAAgAAQAAAAAAUc3RzcwAAAAAAAAABAAAAAQAAABxzdHNjAAAAAAAAAAEAAAABAAAAAgAAAAEAAAAcc3RzegAAAAAAAAAAAAAAAgAAAA8AAAAKAAAAFHN0Y28AAAAAAAAAAQAAAzcAAAA9dWR0YQAAADVtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAAAhpbHN0AAAACGZyZWUAAAAhbWRhdAAAAAtliIQFvJigACFPgAAAAAZBmjgK+oA=";
  let wakeLock = null, wakeVid = null;
  async function keepAwake(on) {
    if (!on) {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      if (wakeVid) wakeVid.pause();
      return;
    }
    if (document.hidden) return;
    if (navigator.wakeLock && window.isSecureContext) {
      try {
        if (!wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
        return;
      } catch { /* refusé : repli vidéo */ }
    }
    if (!wakeVid) {
      wakeVid = document.createElement("video");
      wakeVid.muted = true; wakeVid.loop = true; wakeVid.playsInline = true;
      wakeVid.setAttribute("muted", ""); wakeVid.setAttribute("playsinline", ""); wakeVid.setAttribute("aria-hidden", "true");
      wakeVid.className = "wake"; wakeVid.src = WAKE;
      document.body.appendChild(wakeVid);
    }
    Promise.resolve(wakeVid.play()).catch(() => {});
  }
  // Premier toucher : certains navigateurs n'autorisent la lecture qu'après un geste.
  addEventListener("pointerdown", () => { if (P.awake) keepAwake(true); }, { once: true, capture: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (P.awake) keepAwake(true);
    if (timer) tick();
  });

  // ── Balayage horizontal : page suivante / précédente ─────────────────────
  // Le défilement vertical reste libre ; un tableau qui défile en largeur
  // garde son geste.
  let sx = 0, sy = 0, st = 0, swipeOk = false, touching = false, pending = false;
  const scrollsX = (el) => { for (let n = el; n && n !== document.body; n = n.parentElement) if (n.scrollWidth > n.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return true; return false; };
  $("app").addEventListener("touchstart", (e) => {
    const t0 = e.touches[0]; sx = t0.clientX; sy = t0.clientY; st = Date.now(); touching = true;
    swipeOk = e.touches.length === 1 && !scrollsX(e.target);
  }, { passive: true });
  $("app").addEventListener("touchend", (e) => {
    touching = false;
    if (pending) { pending = false; setTimeout(render, 250); }
    const t1 = e.changedTouches[0]; const dx = t1.clientX - sx, dy = t1.clientY - sy;
    if (!swipeOk || Date.now() - st > 800 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    step(dx < 0 ? 1 : -1);
  }, { passive: true });
  $("app").addEventListener("touchcancel", () => { touching = false; }, { passive: true });

  function setLost(on) {
    $("lost").classList.toggle("hidden", !on);
    $("app").classList.toggle("stale", on);
    $("live").className = on ? "bad" : last && last.connected ? "ok" : "";
  }
  async function tick() {
    if (busy || document.hidden) return;
    busy = true;
    try {
      last = await get("/api/live");
      if (last.ui_theme) setTheme(last.ui_theme);
      fails = 0; setLost(false);
      const key = last.session && last.session.track;
      if (key && (!track || track.track !== key || Date.now() - trackAt > 30000)) { track = await get("/api/track"); trackAt = Date.now(); }
      render();
    } catch (e) {
      if (String(e && e.message) !== "auth" && ++fails > 3) { $("hdr").textContent = T.lost; setLost(true); }
    } finally { busy = false; }
  }
  // Écrans Pédales et Rapport : trame minimale ~15 fois par seconde, seulement quand l'un d'eux est affiché.
  const FAST = ["inputs", "gear"];
  const HMAX = 150; // 10 s de trace
  let inp = null, ibusy = false, itimer = 0;
  const hist = [];
  function inputsLoop(on) {
    if (on && !itimer) itimer = setInterval(itick, 66);
    else if (!on && itimer) { clearInterval(itimer); itimer = 0; }
  }
  async function itick() {
    if (ibusy || document.hidden || !FAST.includes(tpl)) return;
    ibusy = true;
    try {
      inp = await get("/api/inputs");
      const t = inp && inp.telemetry;
      if (t) { hist.push([t.throttle || 0, t.brake || 0]); if (hist.length > HMAX) hist.shift(); }
      updInputs(); updGear();
    } catch { /* la coupure est signalée par l'interrogation principale */ } finally { ibusy = false; }
  }
  // Thème de l'app : posé dans la page par le serveur, suivi à chaque trame.
  function setTheme(t) {
    const th = t === "dark" ? "dark" : "light";
    if (document.documentElement.dataset.theme !== th) document.documentElement.dataset.theme = th;
    document.querySelector('meta[name="theme-color"]').content = th === "dark" ? "#0b101f" : "#f4f5f8";
  }
  setTheme(document.documentElement.dataset.theme);
  let raf = 0;
  const reflow = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (last) render(); }); };
  addEventListener("resize", reflow);
  addEventListener("orientationchange", reflow);
  function start() {
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    tabs(); tick(); if (!timer) timer = setInterval(tick, 1000);
    inputsLoop(FAST.includes(tpl));
    updBars();
    if (P.awake) keepAwake(true);
  }

  // ── Carte : axe principal du tracé dans le sens de la zone d'affichage ───
  // `box` = place disponible (px) : sert à l'orientation et à garder des
  // pastilles lisibles même sur un téléphone.
  function mapSvg(d, box, style) {
    const pts = (track && track.track_points) || [];
    if (pts.length < 8) return `<div class="meta">${T.none}</div>`;
    let mx = 0, mz = 0; for (const p of pts) { mx += p[0]; mz += p[1]; } mx /= pts.length; mz /= pts.length;
    let sxx = 0, szz = 0, sxz = 0; for (const p of pts) { const x = p[0] - mx, z = p[1] - mz; sxx += x * x; szz += z * z; sxz += x * z; }
    // Zone plus haute que large (tablette en portrait) : axe principal à la verticale.
    const ang = 0.5 * Math.atan2(2 * sxz, sxx - szz) + (box.h > box.w ? Math.PI / 2 : 0);
    const ca = Math.cos(-ang), sa = Math.sin(-ang);
    const rot = (p) => { const x = p[0] - mx, z = p[1] - mz; return [x * ca - z * sa, -(x * sa + z * ca)]; };
    const pit = (track && track.pit_lane_points) || [];
    const all = pts.map(rot).concat(pit.map(rot));
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y] of all) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const W = 1000, H = Math.max(300, Math.round(W * (y1 - y0) / Math.max(1, x1 - x0))), pad = 30;
    const k = Math.min((W - 2 * pad) / Math.max(1, x1 - x0), (H - 2 * pad) / Math.max(1, y1 - y0));
    // Échelle écran : pastilles d'au moins ~9 px de rayon (12 px pour ma voiture).
    const ks = Math.max(0.05, Math.min(box.w / W, box.h / H));
    const rCar = Math.max(11, 9 / ks), rMe = Math.max(16, 12 / ks), road = Math.max(22, 9 / ks);
    const P = (p) => { const [x, y] = rot(p); return [pad + (x - x0) * k, pad + (y - y0) * k]; };
    const path = (arr, close) => arr.map((p, i) => { const [x, y] = P(p); return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); }).join("") + (close ? "Z" : "");
    const pitSvg = pit.length > 1 ? `<path d="${path(pit, false)}" fill="none" style="stroke:var(--line)" stroke-width="${(road * 0.36).toFixed(1)}" stroke-dasharray="10 8"/>` : "";
    const cars = (d.standings || []).filter((s) => s.pos_x || s.pos_z).sort((a, b) => (a.is_player ? 1 : 0) - (b.is_player ? 1 : 0)).map((s) => {
      const [x, y] = P([s.pos_x, s.pos_z]); const me = s.is_player; const r = me ? rMe : rCar;
      return `<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${me ? "#ffb400" : classColor(s.vehicle_class)}" style="stroke:var(--panel)" stroke-width="${(r * 0.25).toFixed(1)}"/>` +
        `<text x="${x.toFixed(1)}" y="${(y + r * 0.36).toFixed(1)}" text-anchor="middle" font-size="${(r * 1.05).toFixed(1)}" font-weight="700" fill="#0a0e1a">${s.class_position || s.position}</text></g>`;
    }).join("");
    const lap = path(pts, true);
    return `<svg class="map" viewBox="0 0 ${W} ${H}" style="${style || ""}">${pitSvg}<path d="${lap}" fill="none" style="stroke:var(--line)" stroke-width="${(road * 1.45).toFixed(1)}" stroke-linejoin="round"/><path d="${lap}" fill="none" style="stroke:var(--road)" stroke-width="${road.toFixed(1)}" stroke-linejoin="round"/>${cars}</svg>`;
  }

  // ── Gabarits ─────────────────────────────────────────────────────────────
  const me = (d) => (d.standings || []).find((s) => s.is_player);
  const classOrder = (d) => { const seen = []; for (const s of d.standings || []) if (!seen.includes(s.vehicle_class)) seen.push(s.vehicle_class); return seen; };
  const remaining = (d) => { const sc = d.session || {}; return sc.end_et > 0 ? clock(Math.max(0, sc.end_et - sc.session_time)) : sc.max_laps > 0 && sc.max_laps < 1000 ? `${sc.max_laps} ${T.laps.toLowerCase()}` : clock(sc.session_time); };
  const classMates = (d, p) => (d.standings || []).filter((s) => s.vehicle_class === p.vehicle_class).sort((a, b) => a.class_position - b.class_position);

  // Couleur d'un tour : violet = meilleur tour de la classe, vert = meilleur tour personnel.
  const lapCls = (s, t) => !(t > 0) || Math.abs(t - s.best_lap_time) > 0.0005 ? "" : s.is_class_best_lap ? "sb" : "pb";
  function timingTable(d, rows) {
    const leaders = {}; for (const s of d.standings || []) if (s.class_position === 1) leaders[s.vehicle_class] = s;
    return `<table class="mono tt"><tr><th class="c-pos">${T.pos}</th><th>${T.cls}</th><th class="c-drv">${T.driver}</th><th class="r">${T.gap}</th><th class="r c-int">${T.int}</th><th class="r">${T.last}</th><th class="r c-best">${T.best}</th><th class="r c-laps">${T.laps}</th><th class="r c-pits">${T.pits}</th></tr>` +
      rows.map((s) => `<tr class="${s.is_player ? "me" : ""}"><td class="c-pos"><span class="posn">${s.position}</span></td><td>${clsTag(s.vehicle_class)} <span class="posn">${s.class_position}</span></td><td class="c-drv">${s.in_pits ? `<span class="pit">${T.inPit}</span>` : ""}${esc(s.driver)}</td>` +
        `<td class="r">${gapOf(s, leaders[s.vehicle_class])}</td><td class="r c-int">${s.position > 1 ? "+" + (s.time_behind_next || 0).toFixed(1) : T.none}</td>` +
        `<td class="r ${lapCls(s, s.last_lap_time)}">${lapT(s.last_lap_time)}</td><td class="r c-best ${s.is_class_best_lap ? "sb" : ""}">${lapT(s.best_lap_time)}</td><td class="r c-laps">${s.total_laps}</td><td class="r c-pits">${s.num_pitstops}</td></tr>`).join("") + `</table>`;
  }

  // 1. Classement complet (multiclasse, couleurs de classe), ma voiture épinglée en tête.
  function tplTiming(d) {
    const p = me(d);
    const mine = p ? `<div class="card mine"><div class="lbl">${T.mine}</div>${timingTable(d, [p])}</div>` : "";
    return `${mine}<div class="card tcard">${timingTable(d, d.standings || [])}</div>`;
  }

  // Jauge fine 0-1 (rouge sous 15 %, orange sous 30 %).
  const gauge = (f) => f == null ? "" : `<div class="gauge"><i style="transform:scaleX(${Math.max(0, Math.min(1, f)).toFixed(3)});background:${f < 0.15 ? "var(--bad)" : f < 0.3 ? "var(--amber)" : "var(--ok)"}"></i></div>`;
  // 2. Ingénieur : tout ce qui concerne la voiture du joueur.
  function tplEngineer(d) {
    const p = me(d); const tel = d.telemetry; const w = d.weather || {}; const x = d.extended || {};
    if (!p || !tel) return `<div class="empty">${T.noPlayer}</div>`;
    const cls = classMates(d, p); const i = cls.indexOf(p); const a = cls[i - 1], b = cls[i + 1];
    const wheels = (tel.wheels || []).map((wh, k) => `<div><div class="lbl">${["FL","FR","RL","RR"][k]}</div><div class="mono txt">${Math.round(wh.temp)}°C · ${Math.round(wh.wear)}%</div><div class="bar"><i style="width:${Math.max(0, Math.min(100, wh.wear))}%"></i></div></div>`).join("");
    const v = d.rest && d.rest.vehicle && d.rest.vehicle.state === "fresh" ? d.rest.vehicle.data : null;
    const pads = v && v.brake_condition && v.brake_condition.length === 4 ? v.brake_condition.map((q) => Math.round(Math.min(1, q) * 100) + "%").join(" · ") : T.none;
    return `<div class="page eng">
      <div class="card"><div class="lbl">${T.pos}</div><div class="huge mono">P${p.class_position}</div><div class="meta">${clsTag(p.vehicle_class)} · P${p.position}</div></div>
      <div class="card"><div class="lbl">${T.remaining}</div><div class="big mono">${remaining(d)}</div><div class="meta">${T.lap} ${p.total_laps}</div></div>
      <div class="card"><div class="lbl">${T.ahead}</div><div class="big mono">${a ? "−" + Math.max(0, p.time_behind_leader - a.time_behind_leader).toFixed(1) : T.none}</div><div class="meta ell">${a ? esc(a.driver) : ""}</div></div>
      <div class="card"><div class="lbl">${T.behind}</div><div class="big mono">${b ? "+" + Math.max(0, b.time_behind_leader - p.time_behind_leader).toFixed(1) : T.none}</div><div class="meta ell">${b ? esc(b.driver) : ""}</div></div>
      <div class="card"><div class="lbl">${T.fuel}</div><div class="big mono">${(tel.fuel || 0).toFixed(1)} L</div><div class="meta">${tel.fuel_laps_remaining > 0 ? tel.fuel_laps_remaining.toFixed(1) + " " + T.lapsLeft : T.none}</div>${gauge(tel.fuel_capacity > 0 ? tel.fuel / tel.fuel_capacity : null)}</div>
      <div class="card"><div class="lbl">${T.energy}</div><div class="big mono">${x.virtual_energy > 0 ? Math.round(x.virtual_energy * 100) + "%" : T.none}</div><div class="meta">${T.pads} ${pads}</div>${gauge(x.virtual_energy > 0 ? x.virtual_energy : null)}</div>
      <div class="card"><div class="lbl">${T.last} / ${T.best}</div><div class="big mono"><span class="${lapCls(p, p.last_lap_time)}">${lapT(p.last_lap_time)}</span></div><div class="meta mono"><span class="${p.is_class_best_lap ? "sb" : ""}">${lapT(p.best_lap_time)}</span></div></div>
      <div class="card"><div class="lbl">${T.weather}</div><div class="mono txt">${T.air} ${Math.round(w.air_temp || 0)}° · ${T.track} ${Math.round(w.track_temp || 0)}°</div><div class="mono txt">${T.rain} ${Math.round((w.rain || 0) * 100)}%</div></div>
      <div class="card tyc"><div class="lbl">${T.tyres}</div><div class="wheels">${wheels}</div></div>
    </div>`;
  }

  // 3. Carte : le tracé et les voitures colorées par classe, rien d'autre (dessinée à la taille de sa case).
  const tplMap = () => `<div class="page map1"><div class="card mapslot"></div></div>`;

  // 4. Duel : le joueur face aux voitures devant et derrière dans sa classe.
  function tplDuel(d) {
    const p = me(d);
    if (!p) return `<div class="empty">${T.noPlayer}</div>`;
    const cls = classMates(d, p); const i = cls.indexOf(p);
    const sec = (s) => [1, 2, 3].map((n) => `<td class="r ${s["is_class_best_s" + n] ? "sb" : ""}">${(s["last_s" + n] || 0).toFixed(2)}</td>`).join("");
    const col = (s, title, sign) => !s ? `<div class="card"><div class="lbl">${title}</div><div class="big">${T.none}</div></div>` :
      `<div class="card"><div class="lbl">${title}</div><div class="who ell">${esc(s.driver)}</div><div class="meta">${clsTag(s.vehicle_class)} P${s.class_position}</div>
       <div class="huge mono">${sign}${Math.abs(s.time_behind_leader - p.time_behind_leader).toFixed(1)}</div>
       <table class="mono sect"><tr><th></th><th class="r">${T.last}</th><th class="r">${T.best}</th></tr>
       <tr><td>${esc(s.driver)}</td><td class="r ${lapCls(s, s.last_lap_time)}">${lapT(s.last_lap_time)}</td><td class="r ${s.is_class_best_lap ? "sb" : ""}">${lapT(s.best_lap_time)}</td></tr>
       <tr class="me"><td>${esc(p.driver)}</td><td class="r ${lapCls(p, p.last_lap_time)}">${lapT(p.last_lap_time)}</td><td class="r ${p.is_class_best_lap ? "sb" : ""}">${lapT(p.best_lap_time)}</td></tr></table>
       <table class="mono sect" style="margin-top:.3rem"><tr><th>${T.sectors}</th><th class="r">S1</th><th class="r">S2</th><th class="r">S3</th></tr>
       <tr><td>${esc(s.driver)}</td>${sec(s)}</tr><tr class="me"><td>${esc(p.driver)}</td>${sec(p)}</tr></table></div>`;
    return `<div class="page duel">${col(cls[i - 1], T.ahead, "−")}${col(cls[i + 1], T.behind, "+")}</div>`;
  }

  // 5. TV : temps restant en grand, leaders de chaque classe, carte (à la taille de sa case).
  function tplTv(d) {
    const w = d.weather || {}; const f = d.flags || {};
    const phase = f.yellow_flag_state > 0 ? `<span class="flag" style="background:#facc15">FCY</span>` : `<span class="flag" style="background:#22c55e">GREEN</span>`;
    const leaders = classOrder(d).map((c) => (d.standings || []).find((s) => s.vehicle_class === c && s.class_position === 1)).filter(Boolean);
    return `<div class="page tv"><div class="card"><div class="lbl">${T.remaining}</div><div class="huge mono">${remaining(d)}</div><div style="margin-top:.4rem">${phase}</div>
      <div class="meta" style="margin-top:.4rem">${T.air} ${Math.round(w.air_temp || 0)}° · ${T.track} ${Math.round(w.track_temp || 0)}° · ${T.rain} ${Math.round((w.rain || 0) * 100)}%</div></div>
      <div class="card"><div class="lbl">${T.leader}</div>${leaders.map((s) => `<div class="leadrow">${clsTag(s.vehicle_class)} <b>${esc(s.driver)}</b> <span class="meta">${esc(s.vehicle_name)}</span></div>`).join("")}</div>
      <div class="card mapslot"></div></div>`;
  }

  const pct = (x) => Math.round(Math.max(0, Math.min(1, x || 0)) * 100);

  // 6. Relatif : les voitures juste devant et derrière (même calcul que le widget Relative).
  function tplRelative(d) {
    const p = me(d);
    if (!p) return `<div class="empty">${T.noPlayer}</div>`;
    const multi = classOrder(d).length > 1;
    let rows = (d.standings || []).map((s) => ({ s, rel: s.time_behind_leader - p.time_behind_leader })).sort((a, b) => a.rel - b.rel);
    const pi = rows.findIndex((r) => r.s.is_player);
    // Autant de voitures que la hauteur en permet (même formule de taille que le CSS).
    const v = $("view"), rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 15;
    const fpx = Math.min(1.9 * rem, Math.max(rem, 0.034 * Math.min(v.clientWidth, v.clientHeight) * P.z));
    const side = Math.max(1, Math.min(7, Math.floor((Math.floor((v.clientHeight - 24) / (fpx * 2.35 + 1)) - 1) / 2)));
    rows = rows.slice(Math.max(0, pi - side), pi + side + 1);
    return `<div class="page relp"><div class="card"><table class="mono rel">` + rows.map(({ s, rel }) =>
      `<tr class="${s.is_player ? "me" : ""}"><td><span class="posn">${multi ? s.class_position : s.position}</span></td><td>${clsTag(s.vehicle_class)}</td>` +
      `<td class="c-drv">${s.in_pits ? `<span class="pit">${T.inPit}</span>` : ""}${esc(s.driver)}</td>` +
      `<td class="r" style="color:${s.is_player ? "var(--acct)" : rel < 0 ? "var(--ok)" : "var(--bad)"}">${s.is_player ? T.none : (rel > 0 ? "+" : "") + rel.toFixed(1)}</td>` +
      `<td class="r c-best ${lapCls(s, s.last_lap_time)}">${lapT(s.last_lap_time)}</td></tr>`).join("") + `</table></div></div>`;
  }

  // 7. Drapeaux & stands : drapeau en grand, pénalités, messages du jeu, et tout l'arrêt au stand.
  // Les drapeaux par secteur ne sont pas affichés : la donnée de LMU n'est pas fiable (comme dans l'app).
  function flagInfo(d) {
    const f = d.flags || {}, r = d.rules || {}, p = d.player || {};
    const ph = f.game_phase, y = f.yellow_flag_state || 0;
    if (ph === 8 || p.finish_status === 1) return { cls: "chk", txt: T.fChk };
    if (ph === 7) return { cls: "fr", txt: T.fRed };
    if (r.safety_car_exists && r.safety_car_active) return { cls: "fy", txt: T.fSc };
    if (ph === 6) return { cls: "fy", txt: T.fFcy };
    if (y > 0 && y !== 6) return { cls: "fy", txt: T.fYellow };
    if (p.flag === 6) return { cls: "fb", txt: T.fBlue };
    if (ph === 5) return { cls: "fg", txt: T.fGreen };
    if (ph === 3) return { cls: "fn", txt: T.fFormation };
    if (ph === 4) return { cls: "fn", txt: T.fCountdown };
    return { cls: "fn", txt: T.fWaiting };
  }
  function tplFlags(d) {
    const f = d.flags || {}, p = d.player || {}, x = d.extended || {}, tel = d.telemetry || {};
    const y = f.yellow_flag_state || 0, fi = flagInfo(d);
    const ys = y > 0 ? T["y" + y] : "";
    const pen = p.num_penalties || 0;
    const tl = x.track_limits_per_penalty > 0 ? `${x.track_limits || 0} / ${x.track_limits_per_penalty}` : x.track_limits > 0 ? String(x.track_limits) : T.none;
    const msg = x.history_message || x.status_message || "";
    const lim = !!tel.speed_limiter;
    const pitKmh = x.pit_speed_limit > 0 ? Math.round(x.pit_speed_limit * 3.6) : 0;
    const mine = me(d) || {};
    const fast = mine.in_pits && pitKmh > 0 && tel.speed_kmh > pitKmh + 0.5;
    const pit = d.rest && d.rest.pit && d.rest.pit.state === "fresh" ? d.rest.pit.data : null;
    const menu = pit && Array.isArray(pit.pit_menu) ? pit.pit_menu.slice(0, 10) : [];
    const perLap = pit && pit.energy_per_lap > 0 ? `${Math.round(pit.energy_per_lap * 1000) / 10}% ${T.perLap}` : pit && pit.fuel_per_lap > 0 ? `${pit.fuel_per_lap.toFixed(2)} L ${T.perLap}` : "";
    return `<div class="page flg">
      <div class="flagbig ${fi.cls}">${esc(fi.txt)}${ys ? `<div class="sub">${esc(ys)}</div>` : ""}</div>
      <div class="card"><div class="lbl">${T.penalties}</div><div class="big mono" style="${pen > 0 ? "color:var(--bad)" : ""}">${pen}</div>
        <div class="lbl" style="margin-top:.6rem">${T.trackLimits}</div><div class="big mono">${tl}</div>
        ${msg ? `<div class="lbl" style="margin-top:.6rem">${T.lastMsg}</div><div class="mono">${esc(msg)}</div>` : ""}</div>
      <div class="card"><div class="lbl">${T.pit}</div>
        <div class="kv" style="align-items:center;margin:.35rem 0"><span class="pill" style="background:${lim ? "var(--ok)" : "var(--line)"};color:${lim ? "#000" : "var(--fg)"}">${T.limiter} ${lim ? T.on : T.off}</span>
          ${pitKmh ? `<span class="mono">${T.pitLimit} ${pitKmh} km/h</span>` : ""}</div>
        ${mine.in_pits ? `<div class="big mono" style="${fast ? "color:var(--bad)" : ""}">${Math.round(tel.speed_kmh || 0)} km/h</div>` : ""}
        <div class="kv mono" style="margin:.3rem 0"><span>${esc(T["ps" + (p.pit_state || 0)] || T.ps0)}</span>${y >= 2 && y <= 4 ? `<span>${esc(T["y" + y])}</span>` : ""}<span>${T.pits} ${p.num_pitstops || 0}</span></div>
        ${pit && pit.pit_stop_length_s != null ? `<div class="kv mono"><span>${T.stopLen} ${Math.round(pit.pit_stop_length_s)} s</span>${perLap ? `<span>${perLap}</span>` : ""}</div>` : ""}
        ${menu.length ? `<div class="lbl" style="margin-top:.6rem">${T.pitMenu}</div><table class="mono menu">${menu.map((m) => `<tr><td>${esc(m.name)}</td><td class="r">${esc(m.text)}</td></tr>`).join("")}</table>` : ""}</div>
    </div>`;
  }

  // 8. Pédales : barres, rapport, vitesse, régime, volant, aides, trace des 10 dernières secondes.
  function tplInputs(d) {
    if (!d.telemetry && !(inp && inp.telemetry)) return `<div class="empty">${T.noPlayer}</div>`;
    const bar = (id, label, color) => `<div class="pbar"><div class="tube"><i id="pb-${id}" style="background:${color}"></i></div><div class="lbl">${label}</div><div class="mono" id="pv-${id}">0%</div></div>`;
    return `<div class="page ped">
      <div class="card pbars">${bar("c", T.clutch, "#3b82f6")}${bar("b", T.brake, "var(--bad)")}${bar("t", T.throttle, "var(--ok)")}</div>
      <div class="card"><div class="gear mono" id="pi-g">N</div>
        <div class="big mono" style="text-align:center"><span id="pi-v">0</span> <span class="meta">km/h</span></div>
        <div class="lbl" style="margin-top:.6rem">${T.rpm} <span class="mono" id="pi-r"></span></div><div class="rpm"><i id="pi-rb"></i></div>
        <div class="lbl" style="margin-top:.6rem">${T.steering} <span class="mono" id="pi-s"></span></div><div class="steer"><i id="pi-sb"></i></div>
        <div class="kv mono meta" style="margin-top:.7rem" id="pi-aids"></div></div>
      <div class="card trace"><div class="lbl">${T.trace}</div><svg viewBox="0 0 300 100" preserveAspectRatio="none">
        <polyline id="pt-t" fill="none" style="stroke:var(--ok)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <polyline id="pt-b" fill="none" style="stroke:var(--bad)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
    </div>`;
  }
  function updInputs() {
    if (tpl !== "inputs" || !$("pi-g")) return;
    const t = (inp && inp.telemetry) || (last && last.telemetry);
    if (!t) return;
    const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
    for (const [k, v] of [["c", t.clutch], ["b", t.brake], ["t", t.throttle]]) { $("pb-" + k).style.transform = `scaleY(${Math.max(0, Math.min(1, v || 0)).toFixed(3)})`; set("pv-" + k, pct(v) + "%"); }
    set("pi-g", t.gear < 0 ? "R" : t.gear === 0 ? "N" : String(t.gear));
    set("pi-v", Math.round(t.speed_kmh || 0));
    const rr = t.max_rpm > 0 ? Math.min(1, (t.rpm || 0) / t.max_rpm) : 0;
    set("pi-r", Math.round(t.rpm || 0) + (t.max_rpm > 0 ? " / " + Math.round(t.max_rpm) : ""));
    const rb = $("pi-rb"); rb.style.transform = `scaleX(${rr.toFixed(3)})`; rb.style.background = rr > 0.97 ? "var(--bad)" : rr > 0.9 ? "var(--acc)" : "var(--ok)";
    const sv = Math.max(-1, Math.min(1, t.steering || 0)); $("pi-sb").style.left = (50 + sv * 50) + "%"; set("pi-s", Math.round(sv * 100) + "%");
    const src = inp || {}, x = (last && last.extended) || {};
    const lvl = (v, m) => v == null ? T.none : m > 0 ? `${v}/${m}` : String(v);
    // Répartition : fraction arrière (0-1) ou déjà en % (même lecture que le widget Aides).
    const bbR = (t.rear_brake_bias || 0) > 1.5 ? t.rear_brake_bias : (t.rear_brake_bias || 0) * 100;
    $("pi-aids").innerHTML = `<span>TC ${lvl(src.tc ?? x.tc, src.tc_max ?? x.tc_max)}</span><span>ABS ${lvl(src.abs ?? x.abs, src.abs_max ?? x.abs_max)}</span>` +
      `<span>${T.bias} ${bbR > 0 ? (100 - bbR).toFixed(1) + ":" + bbR.toFixed(1) : T.none}</span><span>${T.motorMap} ${(src.motor_map ?? x.motor_map) || T.none}</span>`;
    if (hist.length > 1) {
      const pts = (k) => hist.map((h, i) => `${(i / (HMAX - 1) * 300).toFixed(1)},${(98 - Math.max(0, Math.min(1, h[k])) * 96).toFixed(1)}`).join(" ");
      $("pt-t").setAttribute("points", pts(0)); $("pt-b").setAttribute("points", pts(1));
    }
  }

  // 10. Rapport : le rapport engagé en très grand, témoins de passage, vitesse, régime.
  // Témoins : part du régime maximal de la voiture (de 80 % à 97 %, puis clignotent).
  function tplGear(d) {
    if (!d.telemetry && !(inp && inp.telemetry)) return `<div class="empty">${T.noPlayer}</div>`;
    const leds = Array.from({ length: 15 }, (_, i) => `<i data-c="${i < 5 ? "g" : i < 10 ? "y" : "r"}"></i>`).join("");
    return `<div class="page gearp"><div class="card dash">
      <div class="leds" id="gd-l">${leds}</div>
      <div class="gbig mono" id="gd-g">N</div>
      <div class="gfoot"><div class="gv g-spd"><span class="gnum mono" id="gd-v">0</span><span class="lbl">km/h</span></div>
        <div class="gv g-rpm"><span class="gnum mono" id="gd-r">0</span><span class="lbl">${T.rpmUnit}</span></div></div>
      <span class="pill limtag hidden" id="gd-lim" style="background:#3b82f6;color:#fff">${T.limTag}</span>
    </div></div>`;
  }
  function updGear() {
    if (tpl !== "gear" || !$("gd-g")) return;
    const t = (inp && inp.telemetry) || (last && last.telemetry);
    if (!t) return;
    $("gd-g").textContent = t.gear < 0 ? "R" : t.gear === 0 ? "N" : String(t.gear);
    $("gd-v").textContent = Math.round(t.speed_kmh || 0);
    $("gd-r").textContent = Math.round(t.rpm || 0);
    const rr = t.max_rpm > 0 ? (t.rpm || 0) / t.max_rpm : 0;
    const lit = Math.round(Math.max(0, Math.min(1, (rr - 0.8) / 0.17)) * 15);
    const box = $("gd-l");
    box.classList.toggle("shift", rr >= 0.97 && !t.speed_limiter);
    $("gd-g").classList.toggle("go", rr >= 0.97 && !t.speed_limiter);
    box.classList.toggle("lim", !!t.speed_limiter);
    $("gd-lim").classList.toggle("hidden", !t.speed_limiter);
    [...box.children].forEach((e, i) => { e.className = i < lit ? e.dataset.c : ""; });
  }

  // 9. Pneus & freins : les quatre roues à leur place (avant en haut).
  const tempBg = (t) => t <= 0 ? "var(--line)" : t > 110 ? "#FF1D43" : t > 95 ? "#eab308" : t < 70 ? "#38bdf8" : "#00c896";
  function tplTyres(d) {
    const tel = d.telemetry;
    if (!tel || !Array.isArray(tel.wheels) || tel.wheels.length < 4) return `<div class="empty">${T.noPlayer}</div>`;
    const v = d.rest && d.rest.vehicle && d.rest.vehicle.state === "fresh" ? d.rest.vehicle.data : null;
    const pads = v && Array.isArray(v.brake_condition) && v.brake_condition.length === 4 ? v.brake_condition : null;
    const cell = (t) => `<span style="background:${tempBg(t)};color:${t > 110 ? "#fff" : t > 0 ? "#000" : "var(--mute)"}">${t > 0 ? Math.round(t) : T.none}</span>`;
    return `<div class="page car4">` + tel.wheels.slice(0, 4).map((wh, k) => {
      const wear = Math.max(0, Math.min(100, wh.wear || 0));
      return `<div class="card"><div class="lbl">${["FL", "FR", "RL", "RR"][k]} · ${esc(k < 2 ? tel.front_compound : tel.rear_compound)}</div>
        <div class="t3 mono">${(wh.temp3 || [0, 0, 0]).map(cell).join("")}</div>
        <div class="kv mono txt"><span>${T.carcass} ${Math.round(wh.temp || 0)}°</span><span>${T.pressure} ${Math.round(wh.pressure || 0)} kPa</span></div>
        <div class="kv mono txt"><span>${T.wear} ${Math.round(wear)}%</span><span>${T.brake} ${wh.brake_temp > 0 ? Math.round(wh.brake_temp) + "°" : T.none}</span>${pads ? `<span>${T.pads} ${Math.round(Math.min(1, pads[k]) * 100)}%</span>` : ""}</div>
        <div class="bar" style="margin-top:.35rem"><i style="width:${wear}%;background:${wear < 30 ? "var(--bad)" : wear < 60 ? "#eab308" : "var(--ok)"}"></i></div>
        ${wh.flat ? `<div class="pill" style="margin-top:.4rem;background:var(--bad);color:#fff">${T.flat}</div>` : ""}${wh.detached ? `<div class="pill" style="margin-top:.4rem;background:var(--bad);color:#fff">${T.detached}</div>` : ""}</div>`;
    }).join("") + `</div>`;
  }

  // Une case dont le contenu dépasse : on réduit le texte de la page par paliers
  // (jusqu'à 62 %) ; si cela ne suffit pas, la page défile au lieu de couper.
  function fitPage(v) {
    v.classList.remove("grow");
    v.style.setProperty("--fk", "1");
    const cells = [...v.querySelectorAll(".page > .card:not(.mapslot), .page > .flagbig")];
    if (!cells.length) return;
    const clipped = () => cells.some((c) => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1);
    let fk = 1;
    while (clipped() && fk > 0.62) { fk = Math.round((fk - 0.08) * 100) / 100; v.style.setProperty("--fk", String(fk)); }
    if (clipped()) v.classList.add("grow");
  }
  const FIT = ["relative", "engineer", "flags", "inputs", "gear", "tyres", "map", "duel", "tv"];
  function render() {
    const d = last; const v = $("view");
    // Pendant un geste, on attend la fin : le contenu ne saute pas sous le doigt.
    if (touching) { pending = true; return; }
    // Pages tableau de bord : pleine zone ; disposition selon la forme de la zone.
    v.classList.toggle("fit", FIT.includes(tpl));
    const ratio = v.clientWidth / Math.max(1, v.clientHeight);
    v.dataset.shape = ratio >= 1.6 ? "wide" : ratio >= 1.05 ? "land" : "port";
    v.classList.toggle("tight", Math.min(innerWidth, innerHeight) < 560);
    if (!d || !d.connected || !d.session) { $("hdr").textContent = T.offline; $("live").className = ""; v.innerHTML = `<div class="empty">${T.offline}</div>`; shownTpl = ""; return; }
    $("live").className = $("app").classList.contains("stale") ? "bad" : "ok";
    $("hdr").textContent = `${d.session.track} · ${remaining(d)}`;
    const f = { timing: tplTiming, relative: tplRelative, engineer: tplEngineer, flags: tplFlags, inputs: tplInputs, gear: tplGear, tyres: tplTyres, map: tplMap, duel: tplDuel, tv: tplTv }[tpl] || tplTiming;
    // Rafraîchi chaque seconde : défilements (vertical et tableaux) conservés.
    const same = shownTpl === tpl;
    // Pédales : la structure reste en place, seules les valeurs bougent (~15 fois par seconde).
    if (tpl === "inputs" && same && $("pi-g")) { updInputs(); return; }
    if (tpl === "gear" && same && $("gd-g")) { updGear(); return; }
    const top = v.scrollTop, xs = [...v.querySelectorAll(".card")].map((c) => c.scrollLeft);
    v.innerHTML = f(d);
    fitPage(v);
    for (const el of v.querySelectorAll(".mapslot")) el.innerHTML = mapSvg(d, { w: Math.max(80, el.clientWidth - 8), h: Math.max(80, el.clientHeight - 8) });
    if (same) { v.querySelectorAll(".card").forEach((c, i) => { if (xs[i]) c.scrollLeft = xs[i]; }); v.scrollTop = top; } else v.scrollTop = 0;
    shownTpl = tpl;
    if (tpl === "inputs") updInputs();
    if (tpl === "gear") updGear();
  }

  if (token) start(); else showLogin();
})();
</script>
</body>
</html>
