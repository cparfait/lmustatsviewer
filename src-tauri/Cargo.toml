[package]
name = "lmustatsviewer"
version = "1.0.9"
description = "Le Mans Ultimate Stats Viewer — v3"
authors = ["cparfait"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "lmustatsviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Raccourcis clavier globaux (spotter : Statut / Mute / Répète, actifs hors focus).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
# Lecture de la télémétrie post-session LMU (fichiers .duckdb écrits nativement
# par le jeu dans UserData/Telemetry/). `bundled` compile libduckdb depuis les
# sources (comme rusqlite) → binaire autonome, pas de DLL système requise.
duckdb = { version = "1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
# Proxy HTTP de l'AI Coach : les appels aux fournisseurs d'IA passent par le
# backend (contourne CORS, sort la clé API des logs réseau de la WebView).
# `rustls-tls` évite toute dépendance à OpenSSL/native-tls sur Windows.
# `blocking` : pont REST LMU en lecture seule (thread dédié, `commands/lmu_rest.rs`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
# Itération asynchrone du flux de réponse IA (streaming SSE/NDJSON).
futures-util = "0.3"
# Chiffrement local de la clé API IA (AES-256-GCM, clé dérivée de la machine).
ring = "0.17"
# Extraction des archives de modèles Vosk téléchargés à la demande (assets.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Captures brutes de la mémoire partagée (commands/shm.rs) : flux compressé écrit
# et relu trame par trame (déjà dans l'arbre via `zip`).
flate2 = "1"
# QR code de l'adresse de la régie tablette (SVG seul, sans images).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
quick-xml = "0.36"
walkdir = "2"
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Credentials", "Win32_Media_Multimedia", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading"] }
# Push-to-talk sur un bouton de volant (commands/wheel.rs) : lecture HID brute en
# arrière-plan pour les volants dont les boutons échappent à winmm (> 32 boutons).
hidapi = "2"
# Reconnaissance vocale offline par commandes (spotter Couche 2). FFI vers libvosk.
# La lib native (resources/stt/lib, fetchée par scripts/fetch-vosk.ps1) est requise
# à la compilation ; les modèles par langue sont téléchargés à la demande (assets.rs).
vosk = "0.3"
# Capture micro native (WASAPI) du moteur d'écoute de l'ingénieur : micro prêt en
# permanence (début de phrase conservé, envoi au silence, mot déclencheur).
cpal = "0.15"

[profile.release]
panic = "abort"      # Strip expensive panic clean-up logic
codegen-units = 1    # Compile crates one after another so the compiler can optimize better
lto = true           # Enables link to optimizations
opt-level = "s"      # Optimize for binary size
strip = true         # Remove debug symbols
