<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilote — LMU Stats Viewer</title>
<meta name="theme-color" content="#D93B00">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=34">
<link rel="icon" href="/favicon.ico?v=34">
<link rel="apple-touch-icon" href="/assets/icon-128.png?v=34">
<link rel="stylesheet" href="/assets/site.css?v=34">
</head>
<body>
<header class="site-header"></header>
<main class="wrap" style="padding-bottom:80px">
  <p class="crumbs"><a href="/" data-i18n="crumbs"></a> › <span data-i18n="profile.kicker"></span></p>
  <div id="notice"></div>
  <div class="profile-head" id="head" hidden>
    <div class="avatar" id="avatar"></div>
    <div><p class="kicker" data-i18n="profile.kicker" style="margin:0"></p><h1 id="name" style="font-size:clamp(1.8rem,3.6vw,2.6rem)"></h1><p class="muted" data-i18n="profile.sub" style="margin:4px 0 0"></p></div>
  </div>
  <div class="panel has-tbar" id="tablePanel" hidden>
    <div class="tbar"><h3 id="tbarName"></h3><span class="tbar-n" id="tbarCount"></span></div>
    <div class="lb-scroll">
    <table class="lb">
      <thead><tr><th data-i18n="col.track"></th><th data-i18n="col.class"></th><th data-i18n="col.car"></th><th data-i18n="col.time"></th><th data-i18n="col.rank"></th><th data-i18n="col.top"></th><th data-i18n="col.gap"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
  </div>
</main>
<footer class="site-footer"></footer>
<script src="/assets/tracks.js?v=34"></script>
<script src="/assets/site.js?v=34"></script>
<script src="/assets/pilote.js?v=34"></script>
</body>
</html>
